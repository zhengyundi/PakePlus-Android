<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>收付款分析 - 账目核对系统</title>
<link rel="stylesheet" href="common.css">
<style>
  :root {
    --ink: #0f172a;
    --text: #334155;
    --muted: #64748b;
    --faint: #94a3b8;
    --line: #e6ebf2;
    --line-soft: #eef2f7;
    --brand: #2563eb;
    --brand-dark: #1d4ed8;
    --surface: #ffffff;
    --radius-lg: 18px;
    --radius: 12px;
    --radius-sm: 9px;
    --shadow-card: 0 1px 2px rgba(15, 23, 42, .04), 0 14px 36px -16px rgba(15, 23, 42, .16);
    --shadow-soft: 0 1px 2px rgba(15, 23, 42, .04), 0 4px 12px -6px rgba(15, 23, 42, .10);
  }

  body {
    background:
      radial-gradient(1000px 480px at 50% -160px, #e8f1ff 0%, rgba(232, 241, 255, 0) 72%),
      #f4f7fb;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .page-card {
    width: min(1000px, calc(100% - 40px));
    margin: 32px auto;
    background: var(--surface);
    border: 1px solid rgba(15, 23, 42, .05);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 30px 34px 32px;
  }

  .page-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line-soft);
  }

  .brand-mark {
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #3b82f6, #1d4ed8);
    box-shadow: 0 8px 18px -8px rgba(37, 99, 235, .6);
    color: #fff;
  }

  .brand-mark svg { width: 23px; height: 23px; }

  .page-head-text { flex: 1; min-width: 0; }

  .page-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .4px;
    color: var(--ink);
    line-height: 1.35;
  }

  .page-sub {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
    text-align: left;
  }

  .head-badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
    padding: 4px 11px;
    border-radius: 999px;
    background: #eff6ff;
    border: 1px solid #dbeafe;
    color: var(--brand-dark);
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .head-badge i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    display: block;
  }

  .dropzone {
    margin-top: 20px;
    border: 1.5px dashed #cdd7e3;
    border-radius: var(--radius);
    background: linear-gradient(180deg, #fbfdff, #f6f9fd);
    padding: 32px 18px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }

  .dropzone:hover,
  .dropzone.drag {
    border-color: var(--brand);
    background: #f3f8ff;
    box-shadow: inset 0 0 0 3px rgba(37, 99, 235, .06);
  }

  .dz-icon {
    width: 46px;
    height: 46px;
    margin: 0 auto 12px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: #fff;
    border: 1px solid #dbeafe;
    box-shadow: 0 6px 16px -8px rgba(37, 99, 235, .45);
    color: var(--brand);
  }

  .dz-icon svg { width: 22px; height: 22px; }

  .dz-main { font-size: 14.5px; color: var(--ink); font-weight: 600; }
  .dz-sub { font-size: 12.5px; color: var(--faint); margin-top: 6px; }

  .file-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }

  .file-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    background: #fff;
    font-size: 12.5px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }

  .file-row:hover { border-color: #dbe3ee; box-shadow: var(--shadow-soft); }

  .file-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
    padding: 0 2px 10px;
  }

  .file-head-title {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
  }

  .file-count {
    display: inline-grid;
    place-items: center;
    min-width: 20px;
    height: 18px;
    padding: 0 6px;
    border-radius: 999px;
    background: #eef4ff;
    color: var(--brand-dark);
    font-size: 11px;
    font-weight: 600;
  }

  .file-type {
    flex: none;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
  }

  .file-type.invoice { background: #eff6ff; color: #1d4ed8; }
  .file-type.bank { background: #ecfdf5; color: #047857; }
  .file-type.unknown { background: #fef2f2; color: #dc2626; }

  .file-name {
    flex: 1;
    color: #334155;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .file-meta { flex: none; color: #64748b; font-size: 12px; }

  .file-mirror {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border: 1px solid #e2e8f0;
    border-radius: 5px;
    color: #475569;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }

  .file-mirror input { margin: 0; cursor: pointer; }
  .file-mirror.on { background: #fff7ed; border-color: #fdba74; color: #c2410c; }

  .file-del {
    flex: none;
    border: 0;
    background: none;
    color: #dc2626;
    font-size: 12px;
    cursor: pointer;
    padding: 2px 4px;
    font-family: inherit;
  }

  .file-del:hover { text-decoration: underline; }

  .status-bar {
    display: none;
    margin-top: 14px;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    line-height: 1.7;
  }

  .status-bar.show { display: block; }
  .status-bar.loading { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  .status-bar.success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .status-bar.warn { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  .status-bar.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #bfdbfe;
    border-top-color: #2563eb;
    border-radius: 50%;
    vertical-align: -2px;
    margin-right: 6px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px solid var(--line-soft);
  }

  .actions .btn { min-height: 42px; }

  .btn-outline {
    background: #fff;
    color: var(--text);
    border: 1px solid #dbe3ee;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }

  .btn-outline:hover:not(:disabled) {
    border-color: #bcd0ee;
    color: var(--brand-dark);
    background: #f8fbff;
  }

  .btn-outline.btn-danger-text { color: #b91c1c; border-color: #f0d6d6; }

  .btn-outline.btn-danger-text:hover:not(:disabled) {
    color: #b91c1c;
    border-color: #e9bcbc;
    background: #fef6f6;
  }

  .print-opt {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    color: #475569;
    cursor: pointer;
    user-select: none;
  }

  .print-opt input {
    width: 14px;
    height: 14px;
    accent-color: #2563eb;
    cursor: pointer;
  }

  /* 打印内容选择面板 */
  .print-panel {
    position: relative;
    font-size: 12.5px;
    color: #475569;
  }

  .print-panel > summary {
    list-style: none;
    cursor: pointer;
    user-select: none;
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    padding: 0 14px;
    border: 1px solid #dbe3ee;
    border-radius: var(--radius-sm);
    background: #fff;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
    transition: border-color .2s ease, color .2s ease;
  }

  .print-panel > summary::-webkit-details-marker { display: none; }
  .print-panel > summary::before { content: '▸ '; color: #2563eb; }
  .print-panel[open] > summary::before { content: '▾ '; }
  .print-panel > summary:hover { border-color: #2563eb; }

  .print-panel-body {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 60;
    min-width: 250px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    padding: 10px 12px;
    display: grid;
    gap: 7px;
  }

  .print-panel-body .print-opt { display: flex; }
  .print-panel-tip { font-size: 11px; color: #94a3b8; line-height: 1.5; }

  /* 筛选栏 */
  .filter-bar {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    margin-top: 18px;
    padding: 16px 18px 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
  }

  .filter-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 1px dashed var(--line-soft);
  }

  .filter-title {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .filter-title::before {
    content: "";
    width: 3px;
    height: 13px;
    border-radius: 2px;
    background: var(--brand);
  }

  .filter-reset {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 28px;
    padding: 0 12px;
    border: 1px solid #dbe3ee;
    border-radius: 7px;
    background: #fff;
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease, background .18s ease;
  }

  .filter-reset:hover {
    color: var(--brand-dark);
    border-color: #bcd0ee;
    background: #f8fbff;
  }

  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 12px 16px;
  }

  .filter-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .filter-item.span-2 { grid-column: span 2; }
  .filter-item.span-all { grid-column: 1 / -1; }

  .filter-item label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    letter-spacing: .2px;
    white-space: nowrap;
  }

  .filter-item select,
  .filter-item input[type="text"],
  .filter-item input[type="date"],
  .ms-trigger {
    height: 36px;
    width: 100%;
    max-width: none;
    padding: 0 10px;
    border: 1px solid #dfe6ef;
    border-radius: 9px;
    background: #fff;
    font-size: 12.5px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    transition: border-color .18s ease, box-shadow .18s ease;
  }

  .filter-item select:focus,
  .filter-item input[type="text"]:focus,
  .filter-item input[type="date"]:focus,
  .ms-trigger:focus-visible {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
  }

  .filter-item select:hover,
  .filter-item input[type="text"]:hover,
  .filter-item input[type="date"]:hover,
  .ms-trigger:hover {
    border-color: #c6d4e6;
  }

  .date-pair {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .date-pair input[type="date"] {
    flex: 1 1 0;
    width: auto;
    min-width: 0;
  }

  .filter-item .date-sep {
    flex: none;
    font-size: 12px;
    color: var(--faint);
  }

  /* 年份多选下拉 */
  .multi-select { position: relative; }

  .ms-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ms-trigger::after {
    content: "";
    flex: none;
    width: 7px;
    height: 7px;
    border-right: 1.5px solid #94a3b8;
    border-bottom: 1.5px solid #94a3b8;
    transform: translateY(-2px) rotate(45deg);
  }

  .ms-trigger.active { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
  .ms-trigger.chosen { color: var(--brand-dark); font-weight: 500; }

  .ms-panel {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 50;
    min-width: 100%;
    max-height: 260px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 14px 32px -14px rgba(15, 23, 42, .28);
    padding: 6px;
  }

  .ms-panel.show { display: block; }

  .ms-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border-radius: 7px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }

  .ms-item:hover { background: #f1f5f9; }
  .ms-item input { width: 14px; height: 14px; accent-color: #2563eb; cursor: pointer; }

  .ms-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 6px 8px 2px;
    margin-top: 4px;
    border-top: 1px solid #eef2f7;
  }

  .ms-link {
    border: 0;
    background: none;
    padding: 0;
    font-size: 12px;
    font-family: inherit;
    color: #2563eb;
    cursor: pointer;
  }

  .ms-link:hover { text-decoration: underline; }

  .btn-sm {
    padding: 6px 12px !important;
    font-size: 12.5px !important;
    height: auto !important;
  }

  .filter-tip {
    margin: 14px 0 0;
    padding-top: 12px;
    border-top: 1px dashed var(--line-soft);
    font-size: 11.5px;
    color: var(--faint);
    line-height: 1.75;
  }

  /* 折叠 */
  .filter-head-actions { display: flex; align-items: center; gap: 8px; }

  .chev {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: translateY(-1px) rotate(45deg);
    transition: transform .2s ease;
  }

  .collapsed .chev { transform: translateY(1px) rotate(-135deg); }

  .filter-bar.collapsed .filter-grid,
  .filter-bar.collapsed .filter-tip { display: none; }

  .filter-bar.collapsed .filter-head {
    padding-bottom: 0;
    margin-bottom: 0;
    border-bottom: 0;
  }

  /* ===== 报告 ===== */
  .report {
    width: min(1120px, calc(100% - 40px));
    margin: 0 auto 44px;
    background: #fff;
    border: 1px solid rgba(15, 23, 42, .05);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 32px 38px 38px;
  }

  .report-head { text-align: center; border-bottom: 2px solid #1e293b; padding-bottom: 16px; }

  .report-head h1 { font-size: 22px; color: var(--ink); letter-spacing: 2px; font-weight: 700; }

  .report-meta {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.9;
  }

  .report-meta b { color: #334155; font-weight: 600; }

  .kpi-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 20px 0 6px;
  }

  .kpi-grid.single { grid-template-columns: 1fr; }

  .link-btn {
    border: 0;
    background: none;
    padding: 0;
    margin-top: 3px;
    font-size: 11.5px;
    font-family: inherit;
    color: #2563eb;
    cursor: pointer;
  }

  .link-btn:hover { text-decoration: underline; }

  table.rpt tbody tr.current-row { background: #f0f7ff; }

  .report-back { text-align: right; margin-bottom: 6px; }

  .report-back .link-btn { font-size: 12.5px; }

  .acct {
    font-family: Consolas, Menlo, monospace;
    font-size: 11.5px;
    color: #475569;
    white-space: nowrap;
  }

  .kpi-card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    background: #fff;
    box-shadow: var(--shadow-soft);
  }

  .kpi-card.recv { border-top: 3px solid var(--brand); }
  .kpi-card.pay { border-top: 3px solid #f59e0b; }

  .kpi-title { font-size: 13px; color: var(--muted); font-weight: 600; }
  .kpi-main {
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin: 6px 0 10px;
    letter-spacing: -.3px;
    font-variant-numeric: tabular-nums;
  }
  .kpi-main small { font-size: 12px; font-weight: 400; color: #94a3b8; margin-right: 4px; }

  .kpi-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: #64748b;
    padding: 3px 0;
  }

  .kpi-row b { color: #1e293b; font-weight: 600; }
  .kpi-row b.green { color: #15803d; }
  .kpi-row b.red { color: #dc2626; }

  .bar {
    height: 7px;
    border-radius: 4px;
    background: #eef2f7;
    overflow: hidden;
    margin-top: 10px;
  }

  .bar i { display: block; height: 100%; border-radius: 4px; }
  .recv .bar i { background: linear-gradient(90deg, #3b82f6, #1d4ed8); }
  .pay .bar i { background: linear-gradient(90deg, #fbbf24, #d97706); }

  .kpi-foot { font-size: 11.5px; color: #94a3b8; margin-top: 8px; }

  .section { margin-top: 26px; }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: #1e293b;
    padding-left: 9px;
    border-left: 4px solid #2563eb;
    margin-bottom: 10px;
  }

  .section-title.pay { border-left-color: #f59e0b; }

  .section-title .sub { font-size: 12px; font-weight: 400; color: #94a3b8; }

  /* 报告板块折叠 */
  .section-title.fold-head,
  .section-title.fold-title {
    cursor: pointer;
    user-select: none;
    padding: 4px 2px 4px 9px;
    transition: color .18s ease;
  }

  .fold-title { margin-top: 20px; }

  .section-title.fold-head:hover,
  .section-title.fold-title:hover { color: #1d4ed8; }

  .section-title.fold-head::after,
  .section-title.fold-title::after {
    content: "";
    flex: none;
    margin-left: auto;
    width: 6px;
    height: 6px;
    border-right: 1.5px solid #94a3b8;
    border-bottom: 1.5px solid #94a3b8;
    transform: translateY(-2px) rotate(45deg);
    transition: transform .2s ease, border-color .2s ease;
  }

  .section-title.fold-head:hover::after,
  .section-title.fold-title:hover::after,
  .section-title.is-folded::after { border-color: #1d4ed8; }

  .section-title.is-folded::after { transform: translateY(1px) rotate(-135deg); }

  .section.is-folded > *:not(.section-title) { display: none; }

  .kpi-grid.is-folded { display: none; }

  .fold-title + .kpi-grid { margin-top: 0; }

  /* 无票资金往来汇总条 */
  .um-summary {
    display: flex;
    align-items: stretch;
    flex-wrap: wrap;
    padding: 16px 20px;
    margin-bottom: 12px;
    background: #f8fafc;
    border: 1px solid #e8edf3;
    border-radius: 10px;
    break-inside: avoid;
  }

  .um-sum-item {
    flex: 1 1 180px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 0 20px;
  }

  .um-sum-item:first-child { padding-left: 0; }

  .um-sum-label { font-size: 12.5px; color: #64748b; }

  .um-sum-value {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.2px;
    color: #1e293b;
    font-variant-numeric: tabular-nums;
  }

  .um-sum-value.in, .um-sum-value.net-pos { color: #15803d; }

  @media print {

  /* 窄屏报告表格：保持完整列宽，改为卡片内左右滑动 */

<body>
<div class="wrapper">
  <div class="page-card no-print">
  <div class="page-head">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
        <path d="M14 3v5h5"/>
        <path d="M9 13h6M9 17h4"/>
      </svg>
    </div>
    <div class="page-head-text">
      <h1 class="page-title">收付款情况分析</h1>
      <p class="page-sub">上传发票数据与银行交易明细（支持多文件、可混合上传），自动核对开票与收付款情况并生成核对报告</p>
    </div>
    <span class="head-badge"><i></i>本地解析</span>
  </div>

    <div class="dropzone" id="dropZone"
         onclick="document.getElementById('fileInput').click()"
         ondragover="event.preventDefault();this.classList.add('drag')"
         ondragleave="this.classList.remove('drag')"
         ondrop="handleDrop(event)">
      <div class="dz-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/>
          <path d="m7 9 5-5 5 5"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
      </div>
      <div class="dz-main">点击选择文件，支持多选或导入 zip 压缩包</div>
      <div class="dz-sub">支持 .xlsx / .xls / .csv；多个文件可打包成 .zip 一次导入，自动解压；发票与银行明细自动识别</div>
    </div>
    <input type="file" id="fileInput" multiple accept=".xlsx,.xls,.csv,.zip" style="display:none" onchange="handleFiles(event)">

    <div class="file-head" id="fileHead" style="display:none;">
      <span class="file-head-title">已上传文件<span class="file-count" id="fileCount">0</span></span>
      <button type="button" class="filter-reset" id="fileFoldBtn" onclick="toggleFileList()">收起<i class="chev"></i></button>
    </div>
    <div class="file-list" id="fileList"></div>
    <div class="status-bar" id="statusBar"></div>

    <div class="filter-bar" id="filterBar" style="display:none;">
      <div class="filter-head">
        <span class="filter-title">筛选条件</span>
        <div class="filter-head-actions">
          <button type="button" class="filter-reset" onclick="resetFilters()">重置筛选</button>
          <button type="button" class="filter-reset" id="filterFoldBtn" onclick="toggleFilterBar()">收起<i class="chev"></i></button>
        </div>
      </div>
      <div class="filter-grid">
        <div class="filter-item">
          <label>年份</label>
          <div class="multi-select" id="yearSelect">
            <button type="button" class="ms-trigger" id="yearTrigger" onclick="toggleYearPanel(event)">全部年份</button>
            <div class="ms-panel" id="yearPanel"></div>
          </div>
        </div>
        <div class="filter-item span-2">
          <label for="fDateStart">日期区间</label>
          <div class="date-pair">
            <input type="date" id="fDateStart" onchange="onFilterChange('date')">
            <span class="date-sep">至</span>
            <input type="date" id="fDateEnd" onchange="onFilterChange('date')">
          </div>
        </div>
        <div class="filter-item">
          <label for="fDirection">方向</label>
          <select id="fDirection" onchange="onFilterChange('direction')">
            <option value="all">全部</option>
            <option value="recv">应收（销售）</option>
            <option value="pay">应付（采购）</option>
            <option value="unmatched">无对应发票往来单位</option>
          </select>
        </div>
        <div class="filter-item">
          <label for="fSettle">核对状态</label>
          <select id="fSettle" onchange="onFilterChange('settle')">
            <option value="">全部</option>
            <option value="open">未结清</option>
            <option value="done">已结清</option>
            <option value="over">多收/多付（超开票）</option>
          </select>
        </div>
        <div class="filter-item">
          <label for="fCompany">往来单位</label>
          <select id="fCompany" onchange="onFilterChange('company')"><option value="">全部单位</option></select>
        </div>
        <div class="filter-item span-all">
          <label for="fKeyword">关键词</label>
          <input type="text" id="fKeyword" placeholder="往来单位名称模糊筛选" oninput="onKeywordChange()">
        </div>
      </div>
      <p class="filter-tip">筛选后自动重算报告；日期可精确到天，填起止日期后仅列示该区间发票，银行流水仍取到最新参与核销（先开票后汇款可结清）；单位表右侧可单独生成该单位报告</p>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="buildBtn" onclick="buildReport()">生成核对报告</button>
      <button class="btn btn-outline" onclick="printReport()">打印报告</button>
      <details class="print-panel no-print" id="printPanel">
        <summary>选择打印部分</summary>
        <div class="print-panel-body">
          <label class="print-opt"><input type="checkbox" checked onchange="toggleSectionPrint('kpi', this.checked)"> 汇总卡片（应收 / 应付）</label>
          <label class="print-opt"><input type="checkbox" checked onchange="toggleSectionPrint('operating', this.checked)"> 经营测算</label>
          <label class="print-opt"><input type="checkbox" checked onchange="toggleSectionPrint('recvGroup', this.checked)"> 应收（销售开票）— 按往来单位核对</label>
          <label class="print-opt"><input type="checkbox" checked onchange="toggleSectionPrint('payGroup', this.checked)"> 应付（取得发票）— 按往来单位核对</label>
          <label class="print-opt"><input type="checkbox" checked onchange="toggleSectionPrint('companyBanks', this.checked)"> 单户银行流水明细（仅单户报告）</label>
          <label class="print-opt"><input type="checkbox" checked onchange="toggleSectionPrint('recvDetail', this.checked)"> 应收（销售开票）— 发票明细核对</label>
          <label class="print-opt"><input type="checkbox" checked onchange="toggleSectionPrint('payDetail', this.checked)"> 应付（取得发票）— 发票明细核对</label>
          <label class="print-opt"><input type="checkbox" id="printUnmatched" checked onchange="toggleUnmatchedPrint(this.checked)"> 无票资金往来</label>
          <label class="print-opt"><input type="checkbox" id="printNotes" onchange="togglePrintNotes(this.checked)"> 核对说明</label>
          <div class="print-panel-tip">勾选的部分才进入打印；屏幕显示不受影响，点击「打印报告」生效。</div>
        </div>
      </details>
      <button class="btn btn-outline btn-danger-text" onclick="clearAll()">清空数据</button>
    </div>
  </div>

  <div class="report" id="report" style="display:none;"></div>
</div>

<script src="xlsx.full.min.js"></script>
<script src="jszip.min.js"></script>
<script src="common.js"></script>
<script>
// 独立单页，不渲染顶部导航
renderFooter();

/* ============ 全局状态 ============ */
var fileRecords = [];
var fileSeq = 0;
var model = null;
var reportView = 'full'; // full=收付款核对报告；unmatched=无票资金往来独立报告；unmatchedCompany=无票单户报告
var unmatchedReturnView = 'full'; // 无票单户报告的来源视图
var unmatchedCompanyName = '';
var filters = { years: [], dateStart: '', dateEnd: '', direction: 'all', settle: '', company: '', keyword: '' };
var includeNotesInPrint = false;
var includeUnmatchedInPrint = true;

/* ============ 工具函数 ============ */
function pad2(n) { return String(n).length < 2 ? '0' + n : String(n); }

function toNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var s = String(v == null ? '' : v).replace(/[,，\s¥￥]/g, '').replace(/[^\d.\-]/g, '');
  var n = Number(s);
  return isFinite(n) ? n : 0;
}

function r2(n) { return Math.round((Number(n) || 0) * 100) / 100; }

function fmtMoney(n) {
  var v = r2(n);
  return v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function normName(s) {
  return String(s == null ? '' : s)
    .replace(/\s+/g, '')
    .replace(/（/g, '(')
    .replace(/）/g, ')')
    .replace(/[，,]/g, '');
}

function normalizeDate(v) {
  if (v == null || v === '') return '';
  var s = String(v).trim();
  var m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  // 银行交易时间常为 yyyyMMdd / yyyyMMddHHmmss 数字，需先于 Excel 序列号解析
  if (/^\d{8}/.test(s)) return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
  if (typeof v === 'number') {
    if (XLSX && XLSX.SSF && XLSX.SSF.parse_date_code) {
      var d = XLSX.SSF.parse_date_code(v);
      if (d) return d.y + '-' + pad2(d.m) + '-' + pad2(d.d);
    }
    return '';
  }
  return s.slice(0, 10);
}

function sizeText(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function colIndex(headers, candidates) {
  var i, j;
  for (i = 0; i < candidates.length; i++) {
    var exact = headers.indexOf(candidates[i]);
    if (exact !== -1) return exact;
  }
  for (i = 0; i < candidates.length; i++) {
    for (j = 0; j < headers.length; j++) {
      if (headers[j] && headers[j].indexOf(candidates[i]) !== -1) return j;
    }
  }
  return -1;
}

function findHeaderRow(rows, test) {
  var max = Math.min(rows.length, 15);
  for (var i = 0; i < max; i++) {
    var h = (rows[i] || []).map(function(c) { return String(c == null ? '' : c).trim(); });
    if (test(h)) return i;
  }
  return -1;
}

// 部分银行在表头前放置账户信息块，用于补齐「本方账号」「账户名称」
function findMetaValue(rows, hIdx, labels) {
  for (var i = 0; i < hIdx; i++) {
    var row = rows[i] || [];
    var label = String(row[0] == null ? '' : row[0]).replace(/[:：\s]/g, '');
    if (labels.indexOf(label) === -1) continue;
    for (var j = 1; j < row.length; j++) {
      var val = String(row[j] == null ? '' : row[j]).trim();
      if (val) return val;
    }
  }
  return '';
}

function isInvoiceHeader(h) {
  return h.indexOf('价税合计') !== -1 &&
    (colIndex(h, ['数电发票号码', '发票号码']) !== -1) &&
    (colIndex(h, ['销方名称', '销售方名称']) !== -1 || colIndex(h, ['购买方名称', '购方名称']) !== -1);
}

function isBankHeader(h) {
  var hasDate = colIndex(h, ['交易时间', '交易日期', '记账日期', '入账日期']) !== -1;
  var hasCp = colIndex(h, ['对方户名', '对方账户名称', '对方账号名称', '交易对手']) !== -1;
  var hasAmt = h.indexOf('收入') !== -1 || h.indexOf('支出') !== -1 ||
    colIndex(h, ['交易金额', '金额', '借方发生额', '贷方发生额']) !== -1;
  return hasDate && hasCp && hasAmt;
}

/* ============ 文件解析 ============ */
function handleFiles(e) {
  var files = [].slice.call((e.target && e.target.files) || []);
  if (!files.length) return;
  e.target.value = '';
  addFiles(files);
}

function handleDrop(e) {
  e.preventDefault();
  var zone = document.getElementById('dropZone');
  zone.classList.remove('drag');
  var files = [].slice.call((e.dataTransfer && e.dataTransfer.files) || []);
  if (!files.length) return;
  addFiles(files);
}

function addFiles(files) {
  setStatus('loading', '<span class="spinner"></span>正在处理 ' + files.length + ' 个文件…');
  var queue = files.slice();
  var chain = Promise.resolve();

  // 压缩包先解压，再统一解析其中的 Excel / CSV
  files.forEach(function(file) {
    if (!/\.zip$/i.test(file.name)) return;
    chain = chain.then(function() {
      setStatus('loading', '<span class="spinner"></span>正在解压 ' + escapeHTML(file.name) + '…');
      return unzipExcel(file).then(function(inner) {
        if (!inner.length) throw new Error('压缩包内没有 Excel / CSV 文件：' + file.name);
        queue = queue.filter(function(f) { return f !== file; }).concat(inner);
      });
    });
  });

  chain.then(function() {
    if (!queue.length) throw new Error('未找到可解析的 Excel / CSV 文件');
    setStatus('loading', '<span class="spinner"></span>正在解析 ' + queue.length + ' 个文件…');
    var seq = Promise.resolve();
    queue.forEach(function(file) {
      seq = seq.then(function() {
        return readRecord(file).then(function(rec) {
          fileRecords.push(rec);
          renderFileList();
        });
      });
    });
    return seq;
  }).then(function() {
    var fail = fileRecords.filter(function(r) { return r.error; }).length;
    var hasInv = fileRecords.some(function(r) { return r.kind === 'invoice'; });
    var hasBank = fileRecords.some(function(r) { return r.kind === 'bank'; });
    if (fail) {
      setStatus('warn', '部分文件解析失败（' + fail + ' 个），请检查文件格式。');
    } else if (hasInv && hasBank) {
      setStatus('success', '✓ 文件已解析：发票 ' + allInvoices().length + ' 张，银行流水 ' + allBanks().length + ' 笔，已自动生成核对报告。');
      showFilterBar(true);
      fillFilterOptions(false);
      buildReport();
    } else if (hasInv) {
      setStatus('warn', '已解析发票数据，请继续上传银行交易明细文件。');
    } else if (hasBank) {
      setStatus('warn', '已解析银行明细，请继续上传发票数据文件。');
    } else {
      setStatus('error', '未识别到发票或银行明细数据，请确认上传的文件。');
    }
  }).catch(function(err) {
    setStatus('error', '解析失败：' + (err && err.message ? err.message : err));
  });
}

// 解压 zip，返回其中的 Excel / CSV 文件
function unzipExcel(file) {
  if (typeof JSZip === 'undefined') return Promise.reject(new Error('解压组件未加载，请刷新页面后重试'));
  return JSZip.loadAsync(file).then(function(zip) {
    var names = [];
    zip.forEach(function(path, entry) {
      if (entry.dir) return;
      if (path.indexOf('__MACOSX/') !== -1) return;
      var base = path.split('/').pop();
      if (!base || base.charAt(0) === '.') return;
      if (/\.(xlsx|xls|csv)$/i.test(base)) names.push(path);
    });
    return Promise.all(names.map(function(path) {
      return zip.file(path).async('blob').then(function(blob) {
        return new File([blob], path.split('/').pop(), { type: blob.type || 'application/octet-stream' });
      });
    }));
  });
}

function readRecord(file) {
  return new Promise(function(resolve) {
    var rec = {
      id: ++fileSeq,
      name: file.name,
      size: file.size,
      kind: 'unknown',
      mirror: false,
      owner: '',
      invoices: [],
      banks: [],
      banksRaw: [],
      error: ''
    };
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        var invMap = new Map();
        var bankMap = new Map();

        wb.SheetNames.forEach(function(sheetName) {
          var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '', raw: true });
          if (!rows.length) return;

          // 浦发交易对手明细打印单由 PDF 转换而来，多列内容合并在换行单元格中，且每页重复表头
          if (isPufaBankSheet(rows)) {
            parsePufaBankSheet(rows, bankMap);
            return;
          }

          var invHead = findHeaderRow(rows, isInvoiceHeader);
          var bankHead = findHeaderRow(rows, isBankHeader);

          if (invHead !== -1 && (bankHead === -1 || invHead <= bankHead)) {
            parseInvoiceSheet(rows, invHead, invMap);
          } else if (bankHead !== -1) {
            parseBankSheet(
              rows,
              bankHead,
              bankMap,
              findMetaValue(rows, bankHead, ['账号', '账户账号', '本方账号']),
              findMetaValue(rows, bankHead, ['账户名称', '户名', '账户名'])
            );
          }
        });

        rec.invoices = Array.from(invMap.values());
        rec.banksRaw = Array.from(bankMap.values());
        rec.banks = rec.banksRaw;
        rec.owner = rec.banksRaw.length ? (rec.banksRaw[0].owner || '') : '';
        if (rec.invoices.length && rec.banks.length) {
          rec.kind = rec.invoices.length >= rec.banks.length ? 'invoice' : 'bank';
        } else if (rec.invoices.length) {
          rec.kind = 'invoice';
        } else if (rec.banks.length) {
          rec.kind = 'bank';
        } else {
          rec.error = '未识别到可用的发票或银行明细数据';
        }
      } catch (err) {
        rec.error = err && err.message ? err.message : '解析失败';
      }
      resolve(rec);
    };
    reader.onerror = function() { rec.error = '文件读取失败'; resolve(rec); };
    reader.readAsArrayBuffer(file);
  });
}

// 一张发票可能跨多行：同一张表内按发票号累加，表与表之间用「首次出现」去重
function parseInvoiceSheet(rows, hIdx, invMap) {
  var headers = rows[hIdx].map(function(c) { return String(c == null ? '' : c).trim(); });
  var iNoDigital = colIndex(headers, ['数电发票号码']);
  var iNoPaper = colIndex(headers, ['发票号码']);
  var iCode = colIndex(headers, ['发票代码']);
  var iAmt = colIndex(headers, ['价税合计']);
  var iSeller = colIndex(headers, ['销方名称', '销售方名称']);
  var iBuyer = colIndex(headers, ['购买方名称', '购方名称']);
  var iDate = colIndex(headers, ['开票日期']);
  var iStatus = colIndex(headers, ['发票状态']);
  var iGoods = colIndex(headers, ['货物或应税劳务名称', '货物或应税劳务、服务名称', '服务名称', '项目名称', '商品名称', '货物名称']);
  if (iNoDigital === -1 && iNoPaper === -1) return;
  if (iAmt === -1) return;

  var sheetMap = new Map();
  for (var i = hIdx + 1; i < rows.length; i++) {
    var row = rows[i] || [];
    // 旧版发票「数电发票号码」常为 --，需回退到「发票号码」
    var digitalNo = iNoDigital !== -1 ? String(row[iNoDigital] == null ? '' : row[iNoDigital]).trim() : '';
    var paperNo = iNoPaper !== -1 ? String(row[iNoPaper] == null ? '' : row[iNoPaper]).trim() : '';
    var no = /\d{6,}/.test(digitalNo) ? digitalNo : paperNo;
    if (!no || !/\d{6,}/.test(no)) continue;
    var code = iCode !== -1 ? String(row[iCode] == null ? '' : row[iCode]).trim() : '';
    var key = (code ? code + '-' : '') + no;

    var item = sheetMap.get(key);
    if (!item) {
      item = {
        key: key,
        no: no,
        date: iDate !== -1 ? normalizeDate(row[iDate]) : '',
        seller: iSeller !== -1 ? String(row[iSeller] == null ? '' : row[iSeller]).trim() : '',
        buyer: iBuyer !== -1 ? String(row[iBuyer] == null ? '' : row[iBuyer]).trim() : '',
        amount: 0,
        goods: '',
        status: iStatus !== -1 ? String(row[iStatus] == null ? '' : row[iStatus]).trim() : ''
      };
      sheetMap.set(key, item);
    }
    // 同一张发票可能有多个商品行，用于识别住宿、餐饮类个人支付发票
    var goods = iGoods !== -1 ? String(row[iGoods] == null ? '' : row[iGoods]).trim() : '';
    if (goods && item.goods.indexOf(goods) === -1) {
      item.goods = item.goods ? item.goods + '；' + goods : goods;
    }
    item.amount = r2(item.amount + toNum(row[iAmt]));
  }
  sheetMap.forEach(function(item, key) {
    // 已作废发票不构成应收应付，直接不参与核对（常见于作废后重开的同额发票）
    if (String(item.status || '').indexOf('作废') !== -1) return;
    var exist = invMap.get(key);
    if (!exist) { invMap.set(key, item); return; }
    // 跨工作表合并：其中一个表没有商品名称列时，用另一个表的补齐
    if (!exist.goods && item.goods) exist.goods = item.goods;
  });
}

// 浦发交易对手明细打印单：PDF 转 Excel 后，序号、日期、借贷、流水号、金额挤在换行单元格中
function isPufaBankSheet(rows) {
  for (var i = 0; i < rows.length; i++) {
    var row = rows[i] || [];
    for (var j = 0; j < row.length; j++) {
      if (String(row[j] == null ? '' : row[j]).indexOf('上海浦东发展银行交易对手明细打印单') !== -1) return true;
    }
  }
  return false;
}

function pufaCellLines(v) {
  return String(v == null ? '' : v).split(/\r?\n/).map(function(s) { return s.trim(); })
    .filter(function(s) { return !!s; });
}

function parsePufaBankSheet(rows, bankMap) {
  var account = '', owner = '';
  rows.forEach(function(row) {
    (row || []).forEach(function(cell) {
      var text = String(cell == null ? '' : cell);
      if (!account) {
        var a = text.match(/账号[：:]\s*(\d{6,})/);
        if (a) account = a[1];
      }
      if (!owner) {
        var o = text.match(/客户户名[：:]\s*([^\n]+)/);
        if (o) owner = o[1].trim();
      }
    });
  });

  rows.forEach(function(row) {
    row = row || [];
    var left = pufaCellLines(row[0]);
    if (left.length < 3 || !/^\d+$/.test(left[0])) return;

    var flagIndex = -1;
    for (var i = 1; i < left.length; i++) {
      if (left[i] === '借' || left[i] === '贷') { flagIndex = i; break; }
    }
    if (flagIndex === -1) return;

    // 正常行：序号/日期/借贷在第 1 列，流水号/金额在第 2 列；
    // 转换错位列：序号/流水号/日期+金额/借贷全部挤在第 1 列。
    var date = '', serial = '', amount = 0;
    for (var j = 1; j < flagIndex; j++) {
      var dm = left[j].match(/^(\d{8})(?:\s+([\d,]+(?:\.\d+)?))?$/);
      if (!dm) continue;
      date = dm[1];
      if (dm[2]) {
        amount = toNum(dm[2]);
        serial = left[j - 1] || '';
      } else {
        var amountCell = pufaCellLines(row[1]);
        serial = amountCell[0] || '';
        amount = toNum(amountCell[1]);
      }
      break;
    }
    if (!date || !amount) return;

    var flag = left[flagIndex];
    var detail = pufaCellLines(row[2]); // 摘要 / 余额 / 对方账号
    var cpInfo = pufaCellLines(row[5]); // 对方名称 / 对方行名 / 对方行号
    var cp = (cpInfo[0] || '').replace(/^[|｜]\s*/, '').trim();
    serial = serial.replace(/^[|｜]\s*/, '').trim();
    var income = flag === '贷' ? amount : 0;
    var expense = flag === '借' ? amount : 0;
    // 柜员流水号可能重复（例如同日手续费与本金），必须连同序号、日期、金额一起去重
    var key = ['pufa', account, left[0], date, serial, flag, r2(amount), detail[2] || ''].join('|');
    if (bankMap.has(key)) return;

    bankMap.set(key, {
      key: key,
      date: normalizeDate(date),
      income: r2(income),
      expense: r2(expense),
      cp: cp,
      purpose: detail[0] || '',
      account: account,
      owner: owner,
      card: '',
      cpAccount: detail[2] || '',
      cpBank: cpInfo[1] || ''
    });
  });
}

// 银行流水：按流水号去重；收入 / 支出拆成两个方向
function parseBankSheet(rows, hIdx, bankMap, metaAccount, metaOwner) {
  var headers = rows[hIdx].map(function(c) { return String(c == null ? '' : c).trim(); });
  var iTime = colIndex(headers, ['交易时间']);
  var iDate = colIndex(headers, ['交易日期', '记账日期', '入账日期']);
  var iIn = colIndex(headers, ['收入', '贷方发生额', '收入金额']);
  var iOut = colIndex(headers, ['支出', '借方发生额', '支出金额']);
  var iAmt = colIndex(headers, ['交易金额', '发生额', '金额']);
  var iFlag = colIndex(headers, ['借贷标志', '收付标志', '收支方向', '借贷方向']);
  var iCp = colIndex(headers, ['对方户名', '对方账户名称', '对方账号名称', '交易对手']);
  var iSerial = colIndex(headers, ['核心唯一流水号', '交易流水号', '业务流水号', '流水号']);
  var iPurpose = colIndex(headers, ['交易用途', '用途']);
  var iSummary = colIndex(headers, ['摘要']);
  var iRemark = colIndex(headers, ['备注', '附言', '交易备注']);
  var iAcct = colIndex(headers, ['本方账号', '账户账号', '账号']);
  // 「账号」「户名」的模糊匹配可能落到对方列，需排除
  if (iAcct !== -1 && headers[iAcct].indexOf('对方') !== -1) iAcct = -1;
  var iOwner = colIndex(headers, ['本方户名', '账户名称', '户名']);
  if (iOwner !== -1 && headers[iOwner].indexOf('对方') !== -1) iOwner = -1;
  var iCard = colIndex(headers, ['单位结算卡卡号', '卡号']);
  var iCpAcct = colIndex(headers, ['对方账号', '对方账户']);
  var iCpBank = colIndex(headers, ['对方账号开户行', '对方开户行']);

  for (var i = hIdx + 1; i < rows.length; i++) {
    var row = rows[i] || [];
    var income = iIn !== -1 ? toNum(row[iIn]) : 0;
    var expense = iOut !== -1 ? toNum(row[iOut]) : 0;

    if (iIn === -1 && iOut === -1 && iAmt !== -1) {
      var amt = toNum(row[iAmt]);
      var flag = iFlag !== -1 ? String(row[iFlag] || '') : '';
      if (/借|付|支出|出/.test(flag)) expense = Math.abs(amt);
      else income = Math.abs(amt);
    } else if (income < 0) {
      expense += Math.abs(income); income = 0;
    } else if (expense < 0) {
      income += Math.abs(expense); expense = 0;
    }

    if (!income && !expense) continue;

    var date = normalizeDate(iTime !== -1 ? row[iTime] : '') || normalizeDate(iDate !== -1 ? row[iDate] : '');
    var rawTime = iTime !== -1 ? String(row[iTime] == null ? '' : row[iTime]).trim() : '';
    var cp = iCp !== -1 ? String(row[iCp] == null ? '' : row[iCp]).trim() : '';
    var account = iAcct !== -1 ? String(row[iAcct] == null ? '' : row[iAcct]).trim() : (metaAccount || '');
    var owner = iOwner !== -1 ? String(row[iOwner] == null ? '' : row[iOwner]).trim() : (metaOwner || '');
    var purposeParts = [];
    [iPurpose, iSummary, iRemark].forEach(function(ix) {
      if (ix === -1) return;
      var val = String(row[ix] == null ? '' : row[ix]).trim();
      if (val && purposeParts.indexOf(val) === -1) purposeParts.push(val);
    });
    var purpose = purposeParts.join(' ');
    var serial = iSerial !== -1 ? String(row[iSerial] == null ? '' : row[iSerial]).trim() : '';
    // 同一柜员流水号可能对应本金和手续费，需结合原始时间、金额、摘要等字段去重
    var key = [serial, rawTime || date, cp, purpose, r2(income), r2(expense), account].join('|');
    if (bankMap.has(key)) continue;

    bankMap.set(key, {
      key: key,
      date: date,
      income: r2(income),
      expense: r2(expense),
      cp: cp,
      purpose: purpose,
      account: account,
      owner: owner,
      card: iCard !== -1 ? String(row[iCard] == null ? '' : row[iCard]).trim() : '',
      cpAccount: iCpAcct !== -1 ? String(row[iCpAcct] == null ? '' : row[iCpAcct]).trim() : '',
      cpBank: iCpBank !== -1 ? String(row[iCpBank] == null ? '' : row[iCpBank]).trim() : ''
    });
  }
}

/* ============ 合并多文件数据 ============ */
function allInvoices() {
  var map = new Map();
  fileRecords.forEach(function(rec) {
    rec.invoices.forEach(function(inv) {
      if (!map.has(inv.key)) map.set(inv.key, inv);
    });
  });
  return Array.from(map.values());
}

function allBanks() {
  var map = new Map();
  fileRecords.forEach(function(rec) {
    rec.banks.forEach(function(b) {
      if (!map.has(b.key)) map.set(b.key, b);
    });
  });
  return Array.from(map.values());
}

/* ============ 文件列表 / 状态 ============ */
function renderFileList() {
  var box = document.getElementById('fileList');
  var head = document.getElementById('fileHead');
  var count = document.getElementById('fileCount');
  if (!fileRecords.length) {
    box.innerHTML = '';
    if (head) head.style.display = 'none';
    return;
  }
  if (head) head.style.display = 'flex';
  if (count) count.textContent = fileRecords.length;
  box.innerHTML = fileRecords.map(function(rec) {
    var typeLabel = rec.kind === 'invoice' ? '发票' : (rec.kind === 'bank' ? '银行' : '未知');
    var typeCls = rec.kind === 'invoice' ? 'invoice' : (rec.kind === 'bank' ? 'bank' : 'unknown');
    var meta = rec.error
      ? '<span style="color:#dc2626;">' + escapeHTML(rec.error) + '</span>'
      : (rec.kind === 'invoice'
          ? rec.invoices.length + ' 张发票'
          : (rec.kind === 'bank' ? rec.banks.length + ' 笔流水' + (rec.mirror ? '（已反转）' : '') : '未识别'));
    var mirrorBox = (rec.kind === 'bank' && rec.owner)
      ? '<label class="file-mirror' + (rec.mirror ? ' on' : '') + '" title="该文件由对方账户导出。勾选后收入、支出互换，往来单位取账户名称「' + escapeHTML(rec.owner) + '」">' +
          '<input type="checkbox"' + (rec.mirror ? ' checked' : '') + ' onchange="toggleMirror(' + rec.id + ', this.checked)">' +
          '对方流水' +
        '</label>'
      : '';
    return '<div class="file-row">' +
      '<span class="file-type ' + typeCls + '">' + typeLabel + '</span>' +
      '<span class="file-name" title="' + escapeHTML(rec.name) + '">' + escapeHTML(rec.name) + '</span>' +
      '<span class="file-meta">' + sizeText(rec.size) + ' ｜ ' + meta + '</span>' +
      mirrorBox +
      '<button class="file-del" onclick="removeFile(' + rec.id + ')">移除</button>' +
    '</div>';
  }).join('');
}

// 折叠 / 展开已上传文件列表
function toggleFileList() {
  var head = document.getElementById('fileHead');
  var list = document.getElementById('fileList');
  var status = document.getElementById('statusBar');
  var btn = document.getElementById('fileFoldBtn');
  var collapsed = head.classList.toggle('collapsed');
  list.style.display = collapsed ? 'none' : '';
  status.style.display = collapsed ? 'none' : '';
  btn.innerHTML = (collapsed ? '展开' : '收起') + '<i class="chev"></i>';
}

// 折叠 / 展开筛选区
function toggleFilterBar() {
  var bar = document.getElementById('filterBar');
  var btn = document.getElementById('filterFoldBtn');
  var collapsed = bar.classList.toggle('collapsed');
  btn.innerHTML = (collapsed ? '展开' : '收起') + '<i class="chev"></i>';
}

// 对方账户流水：收入、支出互换，往来单位取该账户名称
function mirrorBank(b) {
  return {
    key: 'M|' + b.key,
    date: b.date,
    income: b.expense,
    expense: b.income,
    cp: b.owner || '',
    purpose: b.purpose,
    account: b.cpAccount || '',
    owner: b.cp || '',
    card: '',
    cpAccount: b.account || '',
    cpBank: ''
  };
}

function toggleMirror(id, checked) {
  var rec = fileRecords.filter(function(r) { return r.id === id; })[0];
  if (!rec || rec.kind !== 'bank') return;
  rec.mirror = !!checked;
  rec.banks = rec.mirror ? rec.banksRaw.map(mirrorBank) : rec.banksRaw;
  renderFileList();
  fillFilterOptions(true);
  buildReport();
  showToast(rec.mirror ? '已按对方流水反转收支方向' : '已恢复本方流水方向', 'success');
}

function removeFile(id) {
  fileRecords = fileRecords.filter(function(r) { return r.id !== id; });
  renderFileList();
  if (!fileRecords.length) {
    clearAll();
    return;
  }
  var hasInv = fileRecords.some(function(r) { return r.kind === 'invoice'; });
  var hasBank = fileRecords.some(function(r) { return r.kind === 'bank'; });
  if (hasInv && hasBank) {
    showFilterBar(true);
    fillFilterOptions(true);
    buildReport();
  } else {
    model = null;
    showFilterBar(false);
    document.getElementById('report').style.display = 'none';
    setStatus('warn', '已移除文件，当前数据不足以生成报告。');
  }
}

function clearAll() {
  fileRecords = [];
  model = null;
  filters = { years: [], direction: 'all', settle: '', company: '', keyword: '' };
  document.getElementById('fileList').innerHTML = '';
  var fileHead = document.getElementById('fileHead');
  fileHead.style.display = 'none';
  fileHead.classList.remove('collapsed');
  document.getElementById('fileList').style.display = '';
  document.getElementById('statusBar').style.display = '';
  document.getElementById('report').style.display = 'none';
  document.getElementById('report').innerHTML = '';
  showFilterBar(false);
  setStatus('', '');
  showToast('已清空数据', 'success');
}

function setStatus(type, html) {
  var el = document.getElementById('statusBar');
  if (!type) { el.className = 'status-bar'; el.innerHTML = ''; return; }
  el.className = 'status-bar show ' + type;
  el.innerHTML = html;
}

function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ============ 核对逻辑 ============ */
var TOL = 0.1; // 尾差容忍：0.1 元以内视为已结清

function isRedInvoice(inv) {
  return inv.amount <= 0 || String(inv.status || '').indexOf('红冲') !== -1;
}

function directionOf(inv, our) {
  if (inv.seller === our && inv.buyer !== our) return 'recv';
  if (inv.buyer === our && inv.seller !== our) return 'pay';
  return '';
}

// 住宿、餐饮类进项发票通常由个人垫付：计入应付开票金额，视为结清，但不算公司已付款、也不算未付款
var PERSONAL_GOODS_RE = /住宿|餐饮|餐费|伙食/;
var PERSONAL_SELLER_RE = /酒店|宾馆|旅馆|饭店|酒楼|餐饮/;

function isPersonalInvoice(inv) {
  var goods = String(inv.goods || '');
  if (PERSONAL_GOODS_RE.test(goods)) return true;
  // 有商品名称但未命中，说明是正常采购；仅在缺少商品名称时按销方名称兜底
  if (goods) return false;
  return PERSONAL_SELLER_RE.test(String(inv.seller || ''));
}

function detectOurCompany(invoices) {
  var count = {};
  invoices.forEach(function(inv) {
    if (inv.seller) count[inv.seller] = (count[inv.seller] || 0) + 1;
    if (inv.buyer) count[inv.buyer] = (count[inv.buyer] || 0) + 1;
  });
  var best = '', bestN = -1;
  Object.keys(count).forEach(function(k) {
    if (count[k] > bestN) { best = k; bestN = count[k]; }
  });
  return best;
}

/* ============ 筛选 ============ */
function fillSelect(el, values, placeholder) {
  var html = '<option value="">' + placeholder + '</option>';
  values.forEach(function(v) {
    html += '<option value="' + escapeHTML(v) + '">' + escapeHTML(v) + '</option>';
  });
  el.innerHTML = html;
}

function fillFilterOptions(keepCompany) {
  var invoices = allInvoices();
  var our = detectOurCompany(invoices);

  // 年份：只列文件中存在的年份，支持多选
  var years = [];
  invoices.forEach(function(inv) {
    var y = (inv.date || '').slice(0, 4);
    if (y && years.indexOf(y) === -1) years.push(y);
  });
  years.sort();
  filters.years = filters.years.filter(function(y) { return years.indexOf(y) !== -1; });
  renderYearPanel(years);
  updateYearTrigger();

  // 方向
  document.getElementById('fDirection').value = filters.direction;

  // 结清状态：无票资金往来不涉及发票核销，该方向下不适用
  var settleEl = document.getElementById('fSettle');
  if (settleEl) {
    settleEl.value = filters.settle;
    settleEl.disabled = filters.direction === 'unmatched';
  }

  var kwEl = document.getElementById('fKeyword');
  if (kwEl) kwEl.value = filters.keyword || '';

  fillCompanyOptions(keepCompany);
}

// 年份多选：渲染勾选面板
function renderYearPanel(years) {
  var panel = document.getElementById('yearPanel');
  if (!panel) return;
  panel.innerHTML = years.map(function(y) {
    return '<label class="ms-item"><input type="checkbox" class="year-item" data-year="' + y + '"' +
      (filters.years.indexOf(y) !== -1 ? ' checked' : '') + ' onchange="onFilterChange(\'year\')">' + y + ' 年</label>';
  }).join('') +
  '<div class="ms-footer"><button type="button" class="ms-link" onclick="setAllYears(true)">全选</button><button type="button" class="ms-link" onclick="setAllYears(false)">清空</button></div>';
}

function toggleYearPanel(e) {
  if (e) e.stopPropagation();
  var panel = document.getElementById('yearPanel');
  var trigger = document.getElementById('yearTrigger');
  var willShow = !panel.classList.contains('show');
  panel.classList.toggle('show', willShow);
  trigger.classList.toggle('active', willShow);
}

function closeYearPanel() {
  var panel = document.getElementById('yearPanel');
  var trigger = document.getElementById('yearTrigger');
  if (panel) panel.classList.remove('show');
  if (trigger) trigger.classList.remove('active');
}

function updateYearTrigger() {
  var trigger = document.getElementById('yearTrigger');
  if (!trigger) return;
  if (!filters.years.length) {
    trigger.textContent = '全部年份';
    trigger.classList.remove('chosen');
  } else if (filters.years.length === 1) {
    trigger.textContent = filters.years[0] + ' 年';
    trigger.classList.add('chosen');
  } else {
    trigger.textContent = '已选 ' + filters.years.length + ' 个年份';
    trigger.classList.add('chosen');
  }
}

function setAllYears(checked) {
  [].slice.call(document.querySelectorAll('.year-item')).forEach(function(b) { b.checked = checked; });
  onFilterChange('year');
}

// 点击空白处收起年份面板
document.addEventListener('click', function(e) {
  var box = document.getElementById('yearSelect');
  if (box && !box.contains(e.target)) closeYearPanel();
});

// 往来单位名称模糊筛选（不区分大小写），发票与银行流水同一口径
function matchKeyword(name) {
  if (!filters.keyword) return true;
  return String(name || '').toLowerCase().indexOf(filters.keyword.toLowerCase()) !== -1;
}

function fillCompanyOptions(keepCompany) {
  var invoices = allInvoices();
  var our = detectOurCompany(invoices);
  var map = new Map();

  invoices.forEach(function(inv) {
    if (filters.years.length && filters.years.indexOf((inv.date || '').slice(0, 4)) === -1) return;
    if (!inDateRange(inv.date)) return;
    var dir = directionOf(inv, our);
    if (!dir) return;
    if (filters.direction !== 'all' && dir !== filters.direction) return;
    var cp = dir === 'recv' ? inv.buyer : inv.seller;
    if (!cp) return;
    if (!matchKeyword(cp)) return;
    if (!map.has(normName(cp))) map.set(normName(cp), cp);
  });

  var names = Array.from(map.values()).sort(function(a, b) { return a.localeCompare(b, 'zh-CN'); });
  fillSelect(document.getElementById('fCompany'), names, '全部单位');

  var keep = keepCompany || '';
  if (keep && names.indexOf(keep) !== -1) {
    document.getElementById('fCompany').value = keep;
    filters.company = keep;
  } else {
    filters.company = '';
    document.getElementById('fCompany').value = '';
  }
}

// 是否已启用精确到天的日期范围筛选（任一端填了即生效）
function hasDateRange() {
  return !!(filters.dateStart || filters.dateEnd);
}

// 日期字符串（YYYY-MM-DD）是否落在 [dateStart, dateEnd] 区间内；无日期记录在精确日期筛选下排除
function inDateRange(d) {
  if (!hasDateRange()) return true;
  if (!d) return false;
  var day = String(d).slice(0, 10);
  if (filters.dateStart && day < filters.dateStart) return false;
  if (filters.dateEnd && day > filters.dateEnd) return false;
  return true;
}

function readFilters() {
  filters.years = [].slice.call(document.querySelectorAll('.year-item:checked')).map(function(b) { return b.dataset.year; });
  filters.years.sort();
  filters.dateStart = (document.getElementById('fDateStart') || {}).value || '';
  filters.dateEnd = (document.getElementById('fDateEnd') || {}).value || '';
  if (filters.dateStart && filters.dateEnd && filters.dateStart > filters.dateEnd) {
    var tmp = filters.dateStart; filters.dateStart = filters.dateEnd; filters.dateEnd = tmp;
  }
  filters.direction = document.getElementById('fDirection').value || 'all';
  filters.settle = document.getElementById('fSettle').value || '';
  filters.company = document.getElementById('fCompany').value || '';
  filters.keyword = (document.getElementById('fKeyword').value || '').trim();
}

function showFilterBar(show) {
  document.getElementById('filterBar').style.display = show ? 'flex' : 'none';
}

function onFilterChange(kind) {
  readFilters();
  if (kind !== 'company') {
    // 切换年份/方向时保留当前往来单位（仍在新范围内才保留，否则回落到全部单位）
    fillCompanyOptions(filters.company);
  }
  buildReport(false);
}

// 关键词输入防抖，避免每敲一个字就重算报告
var keywordTimer = null;
function onKeywordChange() {
  if (keywordTimer) clearTimeout(keywordTimer);
  keywordTimer = setTimeout(function() { onFilterChange('keyword'); }, 300);
}

function resetFilters() {
  filters = { years: [], dateStart: '', dateEnd: '', direction: 'all', settle: '', company: '', keyword: '' };
  var ds = document.getElementById('fDateStart'); if (ds) ds.value = '';
  var de = document.getElementById('fDateEnd'); if (de) de.value = '';
  fillFilterOptions(false);
  buildReport(false);
}

// 从单户报告返回全部单位（保留年份、方向筛选）
function backToAllCompanies() {
  filters.company = '';
  document.getElementById('fCompany').value = '';
  buildReport(false);
}

// 单位表右侧「单户报告」
function companyReport(side, idx) {
  var d = side === 'recv' ? model.recv : model.pay;
  var g = d.groups[idx];
  if (!g) return;
  filters.direction = side;
  document.getElementById('fDirection').value = side;
  fillCompanyOptions(g.name);
  readFilters();
  buildReport(false);
}

function buildReport(scrollToReport) {
  if (!fileRecords.length) { showToast('请先上传数据文件', 'error'); return; }
  var invoices = allInvoices();
  var banks = allBanks();
  if (!invoices.length) { showToast('未识别到发票数据，请检查发票文件', 'error'); return; }
  if (!banks.length) { showToast('未识别到银行明细，请检查银行文件', 'error'); return; }

  readFilters();
  var our = detectOurCompany(invoices);
  var useDateRange = hasDateRange();
  var isUnmatched = filters.direction === 'unmatched';
  var scope = invoices.filter(function(inv) {
    var dir = directionOf(inv, our);
    if (!dir) return false;
    if (isUnmatched) {
      // 无票方向：需用全量发票识别“有票单位”，只按年份/日期收缩判定范围；
      // 不能应用公司/关键词筛选，否则未命中关键词的有票单位会被误判成无票
      if (useDateRange && !inDateRange(inv.date)) return false;
      if (!useDateRange && filters.years.length && filters.years.indexOf((inv.date || '').slice(0, 4)) === -1) return false;
      return true;
    }
    // 应收/应付方向：完整历史发票先参与核销，之后按年份/日期收缩展示
    if (filters.direction !== 'all' && dir !== filters.direction) return false;
    var cp = dir === 'recv' ? inv.buyer : inv.seller;
    if (filters.company && normName(cp) !== normName(filters.company)) return false;
    if (!matchKeyword(cp)) return false;
    return true;
  });

  // 无票方向：只列示所选区间的资金往来；
  // 应收/应付：选了日期范围时流水不限制（延伸到最新，支持先开票后汇款），
  // 否则选了年份时流水含以前年度、截至所选年份期末。
  var bankScope = banks;
  if (isUnmatched) {
    if (useDateRange) {
      bankScope = bankScope.filter(function(b) { return inDateRange(b.date); });
    } else if (filters.years.length) {
      bankScope = bankScope.filter(function(b) { return filters.years.indexOf((b.date || '').slice(0, 4)) !== -1; });
    }
  } else if (!useDateRange && filters.years.length) {
    var endYear = filters.years.slice().sort().slice(-1)[0];
    var endDate = endYear + '-12-31';
    bankScope = bankScope.filter(function(b) {
      // 无日期流水无法判断是否属于以后年度，保留参与核销，避免漏算；明确晚于期末的才排除
      return !b.date || b.date <= endDate;
    });
  }
  if (filters.company) {
    var key = normName(filters.company);
    bankScope = bankScope.filter(function(b) { return normName(b.cp) === key; });
  }
  if (filters.keyword) {
    bankScope = bankScope.filter(function(b) { return matchKeyword(b.cp); });
  }

  var btn = document.getElementById('buildBtn');
  if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }

  // 全部销售发票的客户集合（不受方向筛选影响），用于判断供应商退款
  var customerKeys = {};
  invoices.forEach(function(inv) {
    if (directionOf(inv, our) === 'recv') customerKeys[normName(inv.buyer)] = 1;
  });
  // 全部采购发票的供应商集合（不受方向筛选影响），用于判断客户退款
  var supplierKeys = {};
  invoices.forEach(function(inv) {
    if (directionOf(inv, our) === 'pay') supplierKeys[normName(inv.seller)] = 1;
  });

  model = reconcile(scope, bankScope, filters, customerKeys, our, supplierKeys);
  model.allInvoiceCount = invoices.length;
  // 报告筛选范围只展示当前范围内实际有业务的年份
  var scopeYears = [];
  scope.forEach(function(inv) {
    var y = (inv.date || '').slice(0, 4);
    if (filters.years.length && filters.direction !== 'unmatched' && filters.years.indexOf(y) === -1) return;
    if (y && scopeYears.indexOf(y) === -1) scopeYears.push(y);
  });
  scopeYears.sort();
  // 判断所选年份是否已覆盖该公司（当前方向）的全部合作年份
  var allYears = [];
  if (filters.company) {
    invoices.forEach(function(inv) {
      var dir = directionOf(inv, our);
      if (!dir) return;
      if (filters.direction !== 'all' && dir !== filters.direction) return;
      var cp = dir === 'recv' ? inv.buyer : inv.seller;
      if (normName(cp) !== normName(filters.company)) return;
      var y = (inv.date || '').slice(0, 4);
      if (y && allYears.indexOf(y) === -1) allYears.push(y);
    });
    allYears.sort();
  }
  model.filters = {
    years: filters.years.slice(),
    displayYears: scopeYears,
    coversAllYears: !!filters.company && allYears.length > 0 && scopeYears.length === allYears.length,
    dateStart: filters.dateStart,
    dateEnd: filters.dateEnd,
    direction: filters.direction,
    settle: filters.settle,
    company: filters.company,
    keyword: filters.keyword
  };
  model.dateRangeView = useDateRange;
  model.dateStart = filters.dateStart;
  model.dateEnd = filters.dateEnd;
  // 有票方向：完整历史发票 + 截至最新流水核销后，按所选年份/日期收缩发票展示；
  // 无票方向不涉及发票核销，不收缩。
  if (filters.direction !== 'unmatched') {
    if (useDateRange) applyDateRangeView(model);
    else if (filters.years.length) applyYearView(model, filters.years);
  }
  // 结清/多收多付状态在核对完成后按单位收缩范围；无票资金往来不涉及发票核销，不适用
  if (filters.settle && filters.direction !== 'unmatched') applySettleFilter(model, filters.settle);
  if (filters.direction === 'unmatched') unmatchedReport();
  else renderReport(model);

  if (btn) { btn.disabled = false; btn.textContent = '生成核对报告'; }
  document.getElementById('report').style.display = '';
  if (scrollToReport !== false) {
    var rep = document.getElementById('report');
    if (rep.scrollIntoView) rep.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function reconcile(invoices, banks, flt, customerKeys, ourCompany, supplierKeys) {
  var our = ourCompany || detectOurCompany(invoices);
  var recvInvoices = [], payInvoices = [], unknown = [];
  invoices.forEach(function(inv) {
    var dir = directionOf(inv, our);
    if (dir === 'recv') recvInvoices.push(inv);
    else if (dir === 'pay') payInvoices.push(inv);
    else unknown.push(inv);
  });

  // 仅有采购发票、没有销售发票的单位：其银行收入视为供应商退款，冲减已付款
  var customers = customerKeys || {};
  var suppliers = supplierKeys || {};
  var payRefundKeys = {};
  payInvoices.forEach(function(inv) {
    var k = normName(inv.seller);
    if (!customers[k]) payRefundKeys[k] = 1;
  });
  // 仅有销售发票、没有采购发票的单位：其银行支出视为客户退款，冲减已回款
  var recvRefundKeys = {};
  recvInvoices.forEach(function(inv) {
    var k = normName(inv.buyer);
    if (!suppliers[k]) recvRefundKeys[k] = 1;
  });

  var recv = reconcileOne(recvInvoices, banks, 'recv', flt, recvRefundKeys, payRefundKeys);
  var pay = reconcileOne(payInvoices, banks, 'pay', flt, payRefundKeys, recvRefundKeys);

  var accounts = [];
  banks.forEach(function(b) {
    var a = b.account || b.card;
    if (a && accounts.indexOf(a) === -1) accounts.push(a);
  });

  return {
    our: our,
    invoices: invoices,
    banks: banks,
    accounts: accounts,
    recv: recv,
    pay: pay,
    unknown: unknown,
    dates: dateRange(invoices, banks),
    generatedAt: nowText()
  };
}

function dateRange(invoices, banks) {
  var list = [];
  invoices.forEach(function(i) { if (i.date) list.push(i.date); });
  banks.forEach(function(b) { if (b.date) list.push(b.date); });
  list.sort();
  if (!list.length) return '—';
  return list[0] + ' 至 ' + list[list.length - 1];
}

function nowText() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
    ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function cpOf(inv, side) {
  return side === 'recv' ? inv.buyer : inv.seller;
}

function reconcileOne(invoices, banks, side, flt, refundKeys, otherRefundKeys) {
  var groups = new Map();
  refundKeys = refundKeys || {};
  otherRefundKeys = otherRefundKeys || {};

  function ensure(name) {
    var k = normName(name);
    if (!groups.has(k)) {
      groups.set(k, {
        key: k,
        name: name || '(未填写往来单位)',
        invoices: [],
        redInvoices: [],
        txns: [],
        refunds: [],
        invoiceAmount: 0,
        personalAmount: 0,
        personalCount: 0,
        payable: 0,
        paid: 0,
        unpaid: 0,
        bankAmount: 0,
        bankLeft: 0,
        redCount: 0,
        redAmount: 0,
        refundTotal: 0
      });
    }
    return groups.get(k);
  }

  invoices.forEach(function(inv) {
    var g = ensure(cpOf(inv, side));
    if (isRedInvoice(inv)) {
      g.redInvoices.push(inv);
      g.redCount++;
      g.redAmount = r2(g.redAmount + inv.amount);
      inv.paid = 0;
      inv.remain = 0;
      inv.matches = [];
      inv.matchStatus = 'red';
    } else {
      g.invoices.push(inv);
      inv.paid = 0;
      inv.remain = inv.amount;
      inv.matches = [];
      inv.matchStatus = 'open';
      // 应付方向的住宿、餐饮发票视为个人支付：保留金额、视为结清，不参与核销
      inv.personal = side === 'pay' && isPersonalInvoice(inv);
      if (inv.personal) {
        inv.remain = 0;
        inv.matchStatus = 'personal';
      }
    }
  });

  // 归集该方向的银行流水（收入→应收核销，支出→应付核销）
  banks.forEach(function(b) {
    var amt = side === 'recv' ? b.income : b.expense;
    if (!amt) return;
    var k = normName(b.cp);
    if (!groups.has(k)) return; // 无对应发票往来单位，单独列示
    groups.get(k).txns.push({
      key: b.key || (side + '-' + k + '-' + groups.get(k).txns.length),
      date: b.date,
      amount: amt,
      remaining: amt,
      purpose: b.purpose,
      account: b.account || b.card || '',
      card: b.card || '',
      cpAccount: b.cpAccount || '',
      cpBank: b.cpBank || ''
    });
  });

  // 反向流水视为退款：应收方向取支出（客户退回），应付方向取收入（供应商退款）
  banks.forEach(function(b) {
    var amt = side === 'recv' ? b.expense : b.income;
    if (!amt) return;
    var k = normName(b.cp);
    if (!groups.has(k) || !refundKeys[k]) return;
    groups.get(k).refunds.push({
      date: b.date,
      amount: amt,
      purpose: b.purpose,
      account: b.account || b.card || '',
      cpAccount: b.cpAccount || '',
      cpBank: b.cpBank || ''
    });
  });

  var unmatchedBank = new Map();
  var skipUnmatched = flt && flt.direction && flt.direction !== 'all' && flt.direction !== 'unmatched' && flt.direction !== side;
  if (!skipUnmatched) banks.forEach(function(b) {
    var amt = side === 'recv' ? b.income : b.expense;
    if (!amt) return;
    // 选了年份时，无对应发票的流水也只展示该年份
    if (flt && flt.years && flt.years.length && flt.years.indexOf((b.date || '').slice(0, 4)) === -1) return;
    var k = normName(b.cp);
    if (groups.has(k)) return;
    // 反向流水已作为退款在其他方向冲减，不再重复列为无对应发票流水
    if (otherRefundKeys[k]) return;
    if (!unmatchedBank.has(k)) {
      unmatchedBank.set(k, { name: b.cp || '(无对方户名)', count: 0, amount: 0, purpose: '', cpAccounts: [], txns: [] });
    }
    var o = unmatchedBank.get(k);
    o.count++;
    o.amount = r2(o.amount + amt);
    o.txns.push({
      date: b.date,
      amount: amt,
      purpose: b.purpose,
      account: b.account || b.card || '',
      cpAccount: b.cpAccount || '',
      cpBank: b.cpBank || ''
    });
    if (!o.purpose && b.purpose) o.purpose = b.purpose;
    if (b.cpAccount && o.cpAccounts.indexOf(b.cpAccount) === -1) o.cpAccounts.push(b.cpAccount);
  });

  // 逐单位核销
  groups.forEach(function(g) {
    var list = g.invoices.filter(function(inv) { return !inv.personal; }).sort(byDateAsc);
    var txns = g.txns.slice().sort(byDateAsc);
    txns.forEach(function(t) { t.remaining = t.amount; });

    // 同额优先（尾差 ±0.1 元），开票日与流水日相差不超过 3 个月，取日期最接近的一张
    function runExact(t) {
      while (t.remaining > TOL) {
        var exact = null, best = Infinity;
        for (var i = 0; i < list.length; i++) {
          var cand = list[i];
          if (cand.remain <= TOL || Math.abs(cand.remain - t.remaining) > TOL) continue;
          if (!withinMonths(cand.date, t.date, 3)) continue;
          var d = dateDist(cand.date, t.date);
          if (d < best) { best = d; exact = cand; }
        }
        if (!exact) break;
        bindPayment(exact, t, Math.min(exact.remain, t.remaining));
      }
    }

    // 核销顺序（先冲旧账）：
    // 1) 同额优先（尾差 ±0.1 元），开票日与流水日相差不超过 3 个月，取日期最接近的一张；
    // 2) 按交易日期先后逐笔核销，先冲开票日期不晚于该笔流水的最早未结清发票（先票后款）；
    //    当期无票可冲时，作为预收/预付余额冲抵其后最早未结清发票。
    // 不再做「同月配对」「3 个月内优先」，确保新到账资金优先清偿历史旧账。
    function runChrono(t) {
      while (t.remaining > TOL) {
        var inv = pickOpenInvoice(list, t.date) || pickOpenInvoice(list, '');
        if (!inv) break;
        bindPayment(inv, t, Math.min(inv.remain, t.remaining));
      }
    }

    // 摘要含定价、订金、保证金的流水最后参与核销，普通流水优先占用发票
    var normalTxns = [], deferredTxns = [];
    txns.forEach(function(t) {
      (isDeferredTxn(t) ? deferredTxns : normalTxns).push(t);
    });
    [normalTxns, deferredTxns].forEach(function(batch) {
      batch.forEach(runExact);
      batch.forEach(runChrono);
    });

    g.invoiceAmount = r2(g.invoices.reduce(function(s, i) { return s + i.amount; }, 0));
    g.personalAmount = r2(g.invoices.reduce(function(s, i) { return s + (i.personal ? i.amount : 0); }, 0));
    g.personalCount = g.invoices.filter(function(i) { return i.personal; }).length;
    g.payable = r2(g.invoiceAmount - g.personalAmount); // 应公司承担的金额，个人支付部分不计入
    g.paid = r2(g.invoices.reduce(function(s, i) { return s + i.paid; }, 0));
    g.bankAmount = r2(g.txns.reduce(function(s, t) { return s + t.amount; }, 0));
    g.grossBank = g.bankAmount;
    g.bankLeft = r2(g.txns.reduce(function(s, t) { return s + t.remaining; }, 0));

    // 退款冲减已回款 / 已付款：先冲未分配的流水，再按发票倒序冲减已核销金额
    if (g.refunds.length) {
      g.refundTotal = r2(g.refunds.reduce(function(s, r) { return s + r.amount; }, 0));
      var rest = g.refundTotal;
      if (g.bankLeft > TOL && rest > TOL) {
        var cutUnalloc = Math.min(g.bankLeft, rest);
        var cut = cutUnalloc;
        g.txns.slice().sort(function(a, b) {
          return (a.date || '') < (b.date || '') ? 1 : -1;
        }).forEach(function(t) {
          if (cut <= TOL || t.remaining <= TOL) return;
          var c = Math.min(t.remaining, cut);
          t.remaining = r2(t.remaining - c);
          t.refundCut = r2((t.refundCut || 0) + c);
          cut = r2(cut - c);
        });
        g.bankLeft = r2(g.bankLeft - cutUnalloc);
        rest = r2(rest - cutUnalloc);
      }
      if (rest > TOL) {
        var rev = g.invoices.slice().sort(function(a, b) {
          return (a.date || '') < (b.date || '') ? 1 : -1;
        });
        rev.forEach(function(inv) {
          if (rest <= TOL || inv.paid <= 0) return;
          var c = Math.min(inv.paid, rest);
          inv.paid = r2(inv.paid - c);
          inv.refundCut = r2((inv.refundCut || 0) + c);
          rest = r2(rest - c);
        });
      }
      g.refundTotal = r2(g.refundTotal - rest); // 未能冲减的部分
      g.bankAmount = r2(g.bankAmount - g.refundTotal);
      g.paid = r2(g.invoices.reduce(function(s, i) { return s + i.paid; }, 0));
    }
    g.txns.forEach(function(t) { t.used = r2(t.amount - t.remaining - (t.refundCut || 0)); });

    g.unpaid = Math.abs(g.payable - g.paid) <= TOL ? 0 : r2(g.payable - g.paid);

    g.invoices.forEach(function(inv) {
      if (inv.personal) { inv.remain = 0; inv.matchStatus = 'personal'; return; }
      inv.remain = r2(inv.amount - inv.paid);
      if (inv.remain <= TOL) inv.remain = 0;
      inv.matchStatus = inv.remain <= TOL ? 'done' : (inv.paid > TOL ? 'partial' : 'open');
    });

    if (g.invoiceAmount <= TOL && g.paid <= TOL) g.status = g.redCount ? 'red' : 'done';
    else if (g.unpaid <= TOL) g.status = 'done';
    else if (g.paid > TOL) g.status = 'partial';
    else g.status = 'open';
  });

  var groupList = Array.from(groups.values()).sort(function(a, b) {
    return b.invoiceAmount - a.invoiceAmount;
  });

  var totalInvoice = r2(groupList.reduce(function(s, g) { return s + g.invoiceAmount; }, 0));
  var totalPersonal = r2(groupList.reduce(function(s, g) { return s + (g.personalAmount || 0); }, 0));
  var totalPersonalCount = groupList.reduce(function(s, g) { return s + (g.personalCount || 0); }, 0);
  var totalPayable = r2(totalInvoice - totalPersonal);
  var totalPaid = r2(groupList.reduce(function(s, g) { return s + g.paid; }, 0));
  var totalBank = r2(groupList.reduce(function(s, g) { return s + g.bankAmount; }, 0));
  var redCount = groupList.reduce(function(s, g) { return s + g.redCount; }, 0);
  var redAmount = r2(groupList.reduce(function(s, g) { return s + Math.abs(g.redAmount || 0); }, 0));
  var totalRefund = r2(groupList.reduce(function(s, g) { return s + (g.refundTotal || 0); }, 0));
  // 合计同样应用尾差容忍，避免明细显示「已结清」而合计出现几分钱未结清
  var totalUnpaid = Math.abs(totalPayable - totalPaid) <= TOL ? 0 : r2(totalPayable - totalPaid);

  return {
    groups: groupList,
    totalInvoice: totalInvoice,
    totalPersonal: totalPersonal,
    totalPersonalCount: totalPersonalCount,
    totalPayable: totalPayable,
    totalPaid: totalPaid,
    totalUnpaid: totalUnpaid,
    totalBank: totalBank,
    totalRefund: totalRefund,
    rate: totalPayable > 0 ? (totalUnpaid === 0 ? 1 : totalPaid / totalPayable) : 0,
    redCount: redCount,
    redAmount: redAmount,
    invoiceCount: invoices.length,
    effectiveCount: invoices.length - redCount,
    unmatchedBank: Array.from(unmatchedBank.values()).sort(function(a, b) { return b.amount - a.amount; }),
    unmatchedBankTotal: r2(Array.from(unmatchedBank.values()).reduce(function(s, o) { return s + o.amount; }, 0))
  };
}

function byDateAsc(a, b) {
  return (a.date || '') < (b.date || '') ? -1 : ((a.date || '') > (b.date || '') ? 1 : 0);
}

// 报告数据期间：年份视图从所选发票起算、到实际参与核销的最新流水日止，避免被历史流水起点拉宽
function updateReportDates(m) {
  var invoiceDates = [];
  m.invoices.forEach(function(inv) { if (inv.date) invoiceDates.push(inv.date); });
  invoiceDates.sort();

  if (m.yearView) {
    if (!invoiceDates.length) { m.dates = '—'; return; }
    var start = invoiceDates[0];
    var end = invoiceDates[invoiceDates.length - 1];
    m.banks.forEach(function(b) { if (b.date && b.date > end) end = b.date; });
    m.dates = start === end ? start : start + ' 至 ' + end;
    return;
  }

  var list = invoiceDates;
  m.banks.forEach(function(b) { if (b.date) list.push(b.date); });
  list.sort();
  m.dates = list.length ? (list.length === 1 ? list[0] : list[0] + ' 至 ' + list[list.length - 1]) : '—';
}

// 收缩展示：完整历史发票与截至最新流水已完成核销，这里只保留 inView 选中的发票，
// 保留各发票的真实核销结果；流水（含区间外）用于展示核销明细。
// inView(inv) 返回 true 表示该发票在本次展示范围内。
function applyShrinkView(m, inView) {
  var keptKeys = {};
  ['recv', 'pay'].forEach(function(sideKey) {
    var side = m[sideKey];
    if (!side) return;

    side.groups = side.groups.map(function(g) {
      // 先记录每笔流水对全部发票、本次范围发票的核销金额，再收缩发票列表
      var matchedTotal = {};
      var matchedView = {};
      g.invoices.forEach(function(inv) {
        var selected = inView(inv);
        (inv.matches || []).forEach(function(x) {
          if (!x.txnKey) return;
          matchedTotal[x.txnKey] = r2((matchedTotal[x.txnKey] || 0) + x.amount);
          if (selected) matchedView[x.txnKey] = r2((matchedView[x.txnKey] || 0) + x.amount);
        });
      });
      g.txns.forEach(function(t) {
        t.matchedTotal = r2(matchedTotal[t.key] || 0);
        t.yearUsed = r2(matchedView[t.key] || 0); // 本次范围发票实际核销金额（供展示复用）
      });

      g.invoices = g.invoices.filter(inView);
      g.redInvoices = g.redInvoices.filter(inView);
      if (!g.invoices.length && !g.redInvoices.length) return null;

      g.invoiceAmount = r2(g.invoices.reduce(function(s, inv) { return s + inv.amount; }, 0));
      g.personalAmount = r2(g.invoices.reduce(function(s, inv) { return s + (inv.personal ? inv.amount : 0); }, 0));
      g.personalCount = g.invoices.filter(function(inv) { return inv.personal; }).length;
      g.payable = r2(g.invoiceAmount - g.personalAmount);
      g.paid = r2(g.invoices.reduce(function(s, inv) { return s + inv.paid; }, 0));
      g.unpaid = Math.abs(g.payable - g.paid) <= TOL ? 0 : r2(g.payable - g.paid);
      g.redCount = g.redInvoices.length;
      g.redAmount = r2(g.redInvoices.reduce(function(s, inv) { return s + inv.amount; }, 0));

      if (g.invoiceAmount <= TOL && g.paid <= TOL) g.status = g.redCount ? 'red' : 'done';
      else if (g.unpaid <= TOL) g.status = 'done';
      else if (g.paid > TOL) g.status = 'partial';
      else g.status = 'open';
      return g;
    }).filter(function(g) { return !!g; });

    side.groups.forEach(function(g) { keptKeys[g.key] = 1; });
    side.groups.sort(function(a, b) { return b.invoiceAmount - a.invoiceAmount; });
    side.totalInvoice = r2(side.groups.reduce(function(s, g) { return s + g.invoiceAmount; }, 0));
    side.totalPersonal = r2(side.groups.reduce(function(s, g) { return s + (g.personalAmount || 0); }, 0));
    side.totalPersonalCount = side.groups.reduce(function(s, g) { return s + (g.personalCount || 0); }, 0);
    side.totalPayable = r2(side.totalInvoice - side.totalPersonal);
    side.totalPaid = r2(side.groups.reduce(function(s, g) { return s + g.paid; }, 0));
    side.totalUnpaid = Math.abs(side.totalPayable - side.totalPaid) <= TOL ? 0 : r2(side.totalPayable - side.totalPaid);
    side.totalBank = r2(side.groups.reduce(function(s, g) { return s + g.bankAmount; }, 0));
    side.totalRefund = r2(side.groups.reduce(function(s, g) { return s + (g.refundTotal || 0); }, 0));
    side.redCount = side.groups.reduce(function(s, g) { return s + g.redCount; }, 0);
    side.redAmount = r2(side.groups.reduce(function(s, g) { return s + Math.abs(g.redAmount || 0); }, 0));
    side.invoiceCount = side.groups.reduce(function(s, g) { return s + g.invoices.length + g.redCount; }, 0);
    side.effectiveCount = side.invoiceCount - side.redCount;
    side.rate = side.totalPayable > 0 ? (side.totalUnpaid === 0 ? 1 : side.totalPaid / side.totalPayable) : 0;
  });

  m.invoices = m.invoices.filter(inView);
  m.banks = m.banks.filter(function(b) { return keptKeys[normName(b.cp)] === 1; });
  updateReportDates(m);
}

// 年份视图：完整历史核销后，仅保留所选年份发票及其真实结清结果
function applyYearView(m, years) {
  var yearSet = {};
  years.forEach(function(y) { yearSet[y] = 1; });
  m.yearView = true;
  m.yearEnd = years.slice().sort().slice(-1)[0] + '-12-31';
  applyShrinkView(m, function(inv) { return yearSet[(inv.date || '').slice(0, 4)] === 1; });
}

// 日期视图：完整历史核销后，仅保留所选日期区间内的发票；流水延伸到最新参与核销，
// 用于支持先开票后汇款（付款日晚于区间结束日）的场景。
function applyDateRangeView(m) {
  m.yearView = true; // 复用报告头流水笔数与明细的收缩展示口径
  m.dateRangeView = true;
  applyShrinkView(m, function(inv) { return inDateRange(inv.date); });
}

// 核对状态筛选：核对完成后按单位状态收缩报告范围，并重算各项合计
function applySettleFilter(m, settle) {
  function keep(g) {
    if (settle === 'open') return g.status === 'open' || g.status === 'partial';
    if (settle === 'over') return g.bankLeft > TOL; // 应收为回款超开票，应付为付款超开票
    return g.status === 'done';
  }

  var keptKeys = {};
  ['recv', 'pay'].forEach(function(sideKey) {
    var side = m[sideKey];
    if (!side) return;
    side.groups = side.groups.filter(keep);
    side.groups.forEach(function(g) { keptKeys[g.key] = 1; });

    var totalInvoice = r2(side.groups.reduce(function(s, g) { return s + g.invoiceAmount; }, 0));
    var totalPersonal = r2(side.groups.reduce(function(s, g) { return s + (g.personalAmount || 0); }, 0));
    var totalPayable = r2(totalInvoice - totalPersonal);
    var totalPaid = r2(side.groups.reduce(function(s, g) { return s + g.paid; }, 0));
    var totalBank = r2(side.groups.reduce(function(s, g) { return s + g.bankAmount; }, 0));
    var totalRefund = r2(side.groups.reduce(function(s, g) { return s + (g.refundTotal || 0); }, 0));
    var redCount = side.groups.reduce(function(s, g) { return s + g.redCount; }, 0);
    var redAmount = r2(side.groups.reduce(function(s, g) { return s + Math.abs(g.redAmount || 0); }, 0));
    var invoiceCount = side.groups.reduce(function(s, g) { return s + g.invoices.length; }, 0);
    var totalUnpaid = Math.abs(totalPayable - totalPaid) <= TOL ? 0 : r2(totalPayable - totalPaid);

    side.totalInvoice = totalInvoice;
    side.totalPersonal = totalPersonal;
    side.totalPersonalCount = side.groups.reduce(function(s, g) { return s + (g.personalCount || 0); }, 0);
    side.totalPayable = totalPayable;
    side.totalPaid = totalPaid;
    side.totalUnpaid = totalUnpaid;
    side.totalBank = totalBank;
    side.totalRefund = totalRefund;
    side.redCount = redCount;
    side.redAmount = redAmount;
