<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>手绘计算器</title>
<link rel="icon" type="image/svg+xml" href="icon.svg" />

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #f7f7f7;
    color: #111;
    font-family: "Comic Sans MS", "Marker Felt", "Segoe UI", system-ui, sans-serif;
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    max-width: 480px;
    margin: 0 auto;
    background-image: radial-gradient(#e5e5e5 1px, transparent 1px);
    background-size: 22px 22px;
    display: flex;
    flex-direction: column;
  }

  #rowsWrap {
    flex: 1;
    min-height: 0;
  }

  .row-card {
    background: #fff;
    border: 2px solid #111;
    border-radius: 22px 18px 24px 16px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 3px 3px 0 #111;
    position: relative;
    transition: all .18s ease;
  }
  .row-card.single {
    padding: 52px 18px;
  }
  /* 只有一行时不需要删除按钮，同时收回为徽章预留的右侧空间 */
  .row-card.single .row-delete {
    display: none;
  }
  .row-card.single .row-content-line {
    padding-right: 0;
  }
  .row-card.single .row-input {
    font-size: 28px;
  }
  .row-card.single .row-result {
    font-size: 28px;
  }
  .row-card.single .row-label {
    font-size:16px;
  }

  .row-card.active {
    outline: 2px dashed #111;
    outline-offset: 4px;
  }

  .row-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    background: #e23b3b;
    border: 2px solid #111;
    border-radius: 50%;
    color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: 1px 1px 0 #111;
    z-index: 2;
    transition: transform .1s ease;
  }
  .row-delete:hover {
    transform: scale(1.12) rotate(90deg);
  }
  .row-delete:active {
    transform: translate(1px, 1px);
    box-shadow: none;
  }

  .row-label {
    font-size: 13px;
    background: #111;
    color: #fff;
    padding: 3px 8px;
    border-radius: 10px;
    transform: rotate(-2deg);
    margin-bottom: 8px;
    display: inline-block;
    transition: font-size 0.18s;
  }

  .row-content-line {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 4px;
    padding-right: 34px; /* 给右上角删除徽章让位，得数不再挤在徽章下方 */
  }

  .row-input {
    flex: 1;
    border: none;
    border-bottom: 2px dashed #111;
    background: transparent;
    outline: none;
    font-size: 20px;
    padding: 6px 2px;
    font-family: inherit;
    min-width: 0;
    transition: font-size 0.18s;
  }

  .row-result {
    font-size: 20px;
    font-weight: 700;
    min-width: 72px;
    text-align: right;
    transform: rotate(0.6deg);
    transition: font-size 0.18s;
    white-space: nowrap;
  }
  @keyframes resultPop {
    0% { transform: rotate(0.6deg) scale(1); }
    50% { transform: rotate(0.6deg) scale(1.18); }
    100% { transform: rotate(0.6deg) scale(1); }
  }
  .row-result.pop {
    animation: resultPop .25s ease;
  }

  .add-row-btn {
    width: 100%;
    background: #fff;
    border: 2px solid #111;
    border-radius: 18px 22px 16px 24px;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    color: #111;
    cursor: pointer;
    margin: 0 0 12px;
    font-family: inherit;
    box-shadow: 3px 3px 0 #111;
    transform: rotate(-0.3deg);
    transition: transform .1s ease, box-shadow .1s ease, background .15s ease;
  }
  .add-row-btn:hover {
    background: #fdfdf3;
    transform: rotate(-0.3deg) scale(1.01);
  }
  .add-row-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #111;
  }

  .site-footer {
    flex-shrink: 0;
    margin-top: 8px;
    text-align: center;
    font-size: 10.5px;
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: .5px;
    color: #9a9a9a;
    transform: rotate(-0.4deg);
    user-select: none;
  }
  .site-footer span {
    border-bottom: 1px dotted #c4c4c4;
    padding-bottom: 1px;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap:9px;
    flex-shrink: 0;
  }

  .key {
    background: #fff;
    border: 2px solid #111;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    font-size:18px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 2px 2px 0 #111;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .key:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 #111;
  }
  .key.op {
    background: #111;
    color: #fff;
  }
  .key.clear {
    background: #fff;
    color: #111;
  }
  .key.eq {
    background: #111;
    color: #fff;
  }
  .key:nth-child(3n) { transform: rotate(0.7deg); }
  .key:nth-child(4n) { transform: rotate(-0.6deg); }

  /* 矮屏（小屏手机 / 浏览器工具栏占位多）：收紧留白，保证键盘与底部版权行都在首屏内 */
  @media (max-height: 700px) {
    .row-card.single { padding: 38px 16px; }
    .add-row-btn { padding: 10px; margin-bottom: 8px; }
    .site-footer { margin-top: 6px; }
  }

  /* PC常规屏：收窄宽度、缩小按键与间距 */
  @media (min-width: 640px) {
    body { max-width: 400px; }
    .keypad { gap: 8px; }
    .key { font-size: 17px; }
    .row-card.single { padding: 52px 16px; }
    .row-card.single .row-input,
    .row-card.single .row-result { font-size: 26px; }
  }

  /* PC中矮窗口：进一步收紧 */
  @media (min-width: 640px) and (max-height: 700px) {
    body { max-width: 360px; }
    .keypad { gap: 6px; }
    .key { font-size: 16px; }
    .add-row-btn { margin-bottom: 8px; }
    .row-card { margin-bottom: 8px; }
    .row-card.single { padding: 44px 14px; }
    .row-card.single .row-input,
    .row-card.single .row-result { font-size: 24px; }
  }

  /* PC很矮的窗口（小窗预览/低分辨率）：最小尺寸，保证全部按键可见 */
  @media (min-width: 640px) and (max-height: 560px) {
    body { max-width: 300px; padding: 8px 12px; }
    .keypad { gap: 6px; }
    .key { font-size: 14px; }
    .add-row-btn { font-size: 14px; margin-bottom: 6px; }
    /* 为底部版权行腾出空间，避免矮窗口出现滚动 */
    .site-footer { margin-top: 6px; font-size: 10px; }
    .row-card { margin-bottom: 6px; }
    .row-card.single { padding: 30px 12px; }
    .row-card.single .row-input,
    .row-card.single .row-result { font-size: 23px; }
  }
</style>
</head>

<body>
<div id="rowsWrap"></div>

<div class="keypad">
  <button class="key clear" onclick="inputKey('C')">C</button>
  <button class="key clear" onclick="inputKey('Backspace')">退格</button>
  <button class="key op" onclick="inputKey('()')">( )</button>
  <button class="key op" onclick="inputKey('÷')">÷</button>

  <button class="key" onclick="inputKey('7')">7</button>
  <button class="key" onclick="inputKey('8')">8</button>
  <button class="key" onclick="inputKey('9')">9</button>
  <button class="key op" onclick="inputKey('×')">×</button>

  <button class="key" onclick="inputKey('4')">4</button>
  <button class="key" onclick="inputKey('5')">5</button>
  <button class="key" onclick="inputKey('6')">6</button>
  <button class="key op" onclick="inputKey('-')">−</button>

  <button class="key" onclick="inputKey('1')">1</button>
  <button class="key" onclick="inputKey('2')">2</button>
  <button class="key" onclick="inputKey('3')">3</button>
  <button class="key op" onclick="inputKey('+')">+</button>

  <button class="key" onclick="inputKey('0')">0</button>
  <button class="key" onclick="inputKey('.')">.</button>
  <button class="key" onclick="inputKey('%')">%</button>
  <button class="key eq" onclick="calcCurrent()">=</button>
</div>

<footer class="site-footer"><span>© 2026 YunD云帝 计算器 v0.0.1</span></footer>

<script>
  let rows = [];
  let activeRowId = null;
  let rowIdCounter = 0;
  let audioCtx = null;

  // 光标位置以行数据为准（单一事实来源），不依赖重建后的输入框。
  // 用户移动光标/点按输入框/键盘输入时，实时同步到对应行。
  document.addEventListener("selectionchange", () => {
    const el = document.activeElement;
    if (!el || !el.classList || !el.classList.contains("row-input")) return;
    const card = el.closest ? el.closest(".row-card") : null;
    if (!card || !card.id) return;
    const id = Number(card.id.slice("row-card-".length));
    const r = rows.find(x => x.id === id);
    if (r && typeof el.selectionStart === "number") r.cursor = el.selectionStart;
  });

  // 按键音效 + 震动
  function playTapSound() {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = "sine";
    osc.frequency.value = 600;
    gain.gain.value = 0.08;
    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);

    // 手机震动
    if(navigator.vibrate) navigator.vibrate(15);
  }

  function esc(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function addRow() {
    playTapSound();
    const id = rowIdCounter++;
    rows.push({ id, expr: "", result: "", cursor: 0 });
    renderRows();
    setActive(id);
  }

  function delRow(id) {
    playTapSound();
    rows = rows.filter(r => r.id !== id);
    if (activeRowId === id) {
      activeRowId = rows.length > 0 ? rows[rows.length - 1].id : null;
    }
    renderRows();
  }

  function setActive(id) {
    if (activeRowId === id) return;
    activeRowId = id;
    // 只切换高亮，不重建输入框：用户点哪个输入框，焦点和光标都保持在原位
    document.querySelectorAll(".row-card").forEach(c => c.classList.remove("active"));
    const card = document.getElementById("row-card-" + id);
    if (card) card.classList.add("active");
  }

  function renderRows() {
    const wrap = document.getElementById("rowsWrap");
    wrap.innerHTML = "";
    const count = rows.length;

    rows.forEach((r, index) => {
      const card = document.createElement("div");
      card.id = "row-card-" + r.id;
      card.className = "row-card" + (count === 1 ? " single" : "") + (r.id === activeRowId ? " active" : "");

      // 单行不显示行号标签，多行才显示
      const labelHtml = count > 1 ? `<span class="row-label">行 ${index + 1}</span>` : "";

      card.innerHTML = `
        <button class="row-delete" title="删除这一行">×</button>
        ${labelHtml}
        <div class="row-content-line">
          <input class="row-input" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="${esc(r.expr)}" />
          <span class="row-result">${r.result}</span>
        </div>
      `;

      const input = card.querySelector(".row-input");
      const delBtn = card.querySelector(".row-delete");

      input.addEventListener("focus", () => setActive(r.id));
      input.addEventListener("click", () => setActive(r.id));
      input.addEventListener("input", e => {
        if (typeof e.target.selectionStart === "number") r.cursor = e.target.selectionStart;
        updateExpr(r.id, e.target.value);
      });
      delBtn.addEventListener("click", () => delRow(r.id));

      wrap.appendChild(card);
      fitRow(card);
    });

    // “添加一行”作为列表最后一张幽灵卡片，随内容一起滚动，不占用固定布局空间
    const addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "add-row-btn";
    addBtn.textContent = "+ 添加一行计算";
    addBtn.addEventListener("click", addRow);
    wrap.appendChild(addBtn);
  }

  function updateExpr(id, val) {
    const r = rows.find(x => x.id === id);
    if (!r) return;
    r.expr = val;
    r.result = safeCalc(val);
    // 只更新结果，不整行重绘，避免输入框失焦、光标跳回末尾
    const span = document.querySelector("#row-card-" + id + " .row-result");
    if (span) span.textContent = r.result;
    const card = document.getElementById("row-card-" + id);
    if (card) fitRow(card);
  }

  function normalizeExpr(str) {
    return String(str)
      .replace(/×/g, "*")
      .replace(/÷/g, "/")
      .replace(/−/g, "-")
      .replace(/,/g, "")
      .replace(/(\d+\.?\d*)%/g, "($1/100)");
  }

  function tryEval(s) {
    if (!s.trim()) return { ok: false };
    try {
      const result = Function("'use strict';return (" + s + ")")();
      if (result === undefined || result === null || isNaN(result) || !isFinite(result)) {
        return { ok: false };
      }
      return { ok: true, value: Math.round(result * 1000000000) / 1000000000 };
    } catch (e) {
      return { ok: false };
    }
  }

  // 把“尚未输完”的表达式补成一个完整表达式，仅用于判断是不是真错误
  function completeForCheck(s) {
    let t = s;
    // 去掉右括号前悬挂的运算符 / 小数点，如 (1+) -> (1)
    t = t.replace(/[+\-*/.]+(?=\))/g, "");
    // 去掉整体末尾悬挂的运算符 / 小数点，如 12+ 、 3×
    t = t.replace(/[+\-*/.]+$/, "");
    // 补上未闭合的左括号
    let open = 0;
    for (const ch of t) {
      if (ch === "(") open++;
      else if (ch === ")") open = Math.max(0, open - 1);
    }
    t += ")".repeat(open);
    // 还没输入内容的空括号按 0 处理
    t = t.replace(/\(\s*\)/g, "0");
    return t;
  }

  function safeCalc(str) {
    if (!str.trim()) return "";
    const s = normalizeExpr(str);

    // 完整且能直接算出结果
    const direct = tryEval(s);
    if (direct.ok) return direct.value;

    // 直接算不出：可能只是没输完。补全后再试，补全能算就不提示错误
    if (tryEval(completeForCheck(s)).ok) return "";

    // 补全后仍失败（如除以0、1..2、2(*3)）才是真正的错误
    return "错误";
  }

  function inputKey(key) {
    playTapSound();
    if (activeRowId === null) {
      addRow();
      return;
    }
    const r = rows.find(x => x.id === activeRowId);

    // 插入点优先使用保存在行数据中的光标位置（即使输入框被重建、焦点恢复失败也准确）
    let selStart = (Number.isInteger(r.cursor) && r.cursor >= 0 && r.cursor <= r.expr.length)
      ? r.cursor : r.expr.length;
    let selEnd = selStart;
    // 若用户在输入框中手动选中了一段文字，沿用其选区终点
    const oldInput = document.querySelector(".row-card.active .row-input");
    if (oldInput && oldInput.selectionStart === selStart && typeof oldInput.selectionEnd === "number") {
      selEnd = oldInput.selectionEnd;
    }

    let pos = selStart;
    if (key === "C") {
      r.expr = "";
      pos = 0;
    } else if (key === "Backspace") {
      // 按光标位置删除，而不是只删末尾
      if (selStart === selEnd) {
        if (selStart > 0) {
          r.expr = r.expr.slice(0, selStart - 1) + r.expr.slice(selEnd);
          pos = selStart - 1;
        }
      } else {
        r.expr = r.expr.slice(0, selStart) + r.expr.slice(selEnd);
        pos = selStart;
      }
    } else if (key === "()") {
      // 在光标处插入成对括号，光标停在括号中间
      r.expr = r.expr.slice(0, selStart) + "()" + r.expr.slice(selEnd);
      pos = selStart + 1;
    } else {
      // 在光标处插入按键内容
      r.expr = r.expr.slice(0, selStart) + key + r.expr.slice(selEnd);
      pos = selStart + key.length;
    }

    r.result = safeCalc(r.expr);
    r.cursor = pos;

    // 不重建输入框：直接更新同一个节点。
    // 节点存活时其光标位置始终是真实的（失焦不会改变光标），
    // 从根本上避免重建产生的“光标在0”假状态导致倒序插入。
    if (oldInput) {
      oldInput.value = r.expr;
      const resSpan = oldInput.closest(".row-card").querySelector(".row-result");
      if (resSpan) resSpan.textContent = r.result;
      oldInput.focus();
      oldInput.setSelectionRange(pos, pos);
      fitRow(oldInput.closest(".row-card"));
    } else {
      renderRows();
    }
  }

  function calcCurrent() {
    playTapSound();
    if (activeRowId === null) return;
    const r = rows.find(x => x.id === activeRowId);
    const s = normalizeExpr(r.expr);
    let out = safeCalc(r.expr);
    // 输入未完成（如 12+、3×(2+ ）时，按等于号自动补全并给出结果
    if (out === "" && s.trim()) {
      const t = tryEval(completeForCheck(s));
      if (t.ok) out = t.value;
    }
    r.result = out;

    // 只更新当前行结果，不重建输入框，保持焦点与光标
    const card = document.getElementById("row-card-" + r.id);
    if (card) {
      const span = card.querySelector(".row-result");
      if (span) {
        span.textContent = r.result;
        span.classList.remove("pop");
        void span.offsetWidth; // 重启动画
        span.classList.add("pop");
      }
      fitRow(card);
    } else {
      renderRows();
    }
  }

  // 位数过多时按实际宽度精确缩小字号，保证公式和结果完整显示、不截断。
  // 用 canvas 测量文字宽度：结果区最多占行宽 55%，输入框占剩余空间，各自等比缩小。
  function fitRow(card) {
    const line = card.querySelector(".row-content-line");
    const input = card.querySelector(".row-input");
    const result = card.querySelector(".row-result");
    if (!line || !input) return;

    const ctx = fitRow._ctx || (fitRow._ctx = document.createElement("canvas").getContext("2d"));
    const measure = (el, text, size) => {
      const cs = getComputedStyle(el);
      ctx.font = cs.fontWeight + " " + size + "px " + cs.fontFamily;
      return ctx.measureText(text || " ").width;
    };
    const baseOf = el => {
      // 首次读取 CSS 断点定义的基准字号并缓存，后续在此基础上缩放
      if (!el.dataset.base) el.dataset.base = parseFloat(getComputedStyle(el).fontSize);
      return parseFloat(el.dataset.base);
    };

    // 行内可用总宽：内容行宽 - 右侧为删除徽章预留的 padding
    const padRight = parseFloat(getComputedStyle(line).paddingRight) || 0;
    const total = line.clientWidth - padRight;
    const gap = 10;

    // 结果区最多占 45%，先缩结果
    let resultW = 0;
    if (result) {
      const base = baseOf(result);
      const text = result.textContent;
      const avail = total * 0.45;
      let size = base;
      const w = measure(result, text, base);
      if (w > avail && w > 0) size = Math.max(9, Math.floor((base * avail / w) * 10) / 10);
      result.style.fontSize = size + "px";
      resultW = Math.min(measure(result, text, size), avail);
    }

    // 输入框占剩余空间（减去自身左右 padding 约 4px 与间隙），同样只缩不截断
    const ibase = baseOf(input);
    const iavail = Math.max(total - gap - resultW - 8, 60) * 0.97;
    let isize = ibase;
    const iw = measure(input, input.value, ibase);
    if (iw > iavail && iw > 0) isize = Math.max(9, Math.floor((ibase * iavail / iw) * 10) / 10);
    input.style.fontSize = isize + "px";
  }

  addRow();
</script>
</body>
</html>
