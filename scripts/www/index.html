    side.invoiceCount = invoiceCount;
    side.effectiveCount = invoiceCount - redCount;
    side.rate = totalPayable > 0 ? (totalUnpaid === 0 ? 1 : totalPaid / totalPayable) : 0;
  });

  // 报告头「本次发票 / 参与核对的银行流水」同步收缩到保留单位
  m.invoices = m.invoices.filter(function(inv) {
    var dir = directionOf(inv, m.our);
    var cp = dir === 'recv' ? inv.buyer : inv.seller;
    return keptKeys[normName(cp)] === 1;
  });
  m.banks = m.banks.filter(function(b) { return keptKeys[normName(b.cp)] === 1; });
  updateReportDates(m);
  m.hideUnmatched = true; // 无票流水无结清概念，按结清状态筛选时不列示
}

// 两日期相差天数，用于同额匹配时优先取日期最接近的发票
function dateDist(a, b) {
  if (!a || !b) return 999999;
  return Math.abs(new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000;
}

// 判断两个日期是否在指定月数以内（按自然月计算）
function withinMonths(a, b, months) {
  if (!a || !b) return false;
  var earlier = a < b ? a : b;
  var later = a < b ? b : a;
  var limit = new Date(earlier + 'T00:00:00');
  limit.setMonth(limit.getMonth() + months);
  return new Date(later + 'T00:00:00') <= limit;
}

// 摘要含定价、订金、保证金的流水，核销优先级最低
function isDeferredTxn(t) {
  return /定价|订金|保证金/.test(t.purpose || '');
}

// 取最早的未结清发票；maxDate 为空时不限制开票日期
function pickOpenInvoice(list, maxDate) {
  for (var i = 0; i < list.length; i++) {
    var inv = list[i];
    if (inv.remain <= TOL) continue;
    if (maxDate && inv.date && inv.date > maxDate) continue;
    return inv;
  }
  return null;
}

function bindPayment(inv, txn, amount) {
  var use = r2(Math.min(txn.remaining, amount));
  if (use <= 0) return;
  txn.remaining = r2(txn.remaining - use);
  inv.paid = r2(inv.paid + use);
  inv.remain = r2(inv.remain - use);
  inv.matches.push({ date: txn.date, amount: use, txnKey: txn.key });
}

/* ============ 报告渲染 ============ */
function filterSummary(f) {
  var parts = [];
  var shownYears = (f.years && f.years.length && f.displayYears && f.displayYears.length) ? f.displayYears : f.years;
  var dateText = '';
  if (f.dateStart || f.dateEnd) {
    dateText = (f.dateStart || '不限起') + ' 至 ' + (f.dateEnd || '不限止');
  }
  var yearText;
  if (dateText) {
    yearText = dateText + (f.years && f.years.length ? '（同时限定 ' + (shownYears && shownYears.length ? shownYears.join('、') : f.years.join('、')) + ' 年）' : '');
  } else if (!f.years || !f.years.length) {
    yearText = '全部年份';
  } else if (!shownYears || !shownYears.length) {
    yearText = '全部年份';
  } else {
    yearText = shownYears.join('、') + ' 年' + (f.coversAllYears ? '（全部年份）' : '');
  }
  parts.push(yearText);
  parts.push(f.direction === 'recv' ? '应收' : (f.direction === 'pay' ? '应付' : (f.direction === 'unmatched' ? '无对应发票往来单位' : '全部方向')));
  if (f.settle) parts.push(f.settle === 'open' ? '未结清' : (f.settle === 'over' ? '多收/多付（超开票）' : '已结清'));
  parts.push(f.company || '全部单位');
  if (f.keyword) parts.push('关键词「' + f.keyword + '」');
  return parts.join(' · ');
}

function renderReport(m) {
  reportView = 'full';
  var recvLabel = '应收（销售开票）';
  var payLabel = '应付（取得发票）';
  var f = m.filters || { years: [], direction: 'all', company: '' };
  var title = f.company ? escapeHTML(f.company) + ' 收付款核对报告' : '收付款情况核对报告';
  var redTotal = (m.recv.redCount || 0) + (m.pay.redCount || 0);
  var personalTotal = (m.recv.totalPersonalCount || 0) + (m.pay.totalPersonalCount || 0);
  var effTotal = (m.recv.invoiceCount - m.recv.redCount - (m.recv.totalPersonalCount || 0)) +
    (m.pay.invoiceCount - m.pay.redCount - (m.pay.totalPersonalCount || 0));
  var bankCountHTML = '参与核对的银行流水 <b>' + m.banks.length + '</b> 笔';
  if (m.yearView) {
    var relatedTxnKeys = new Set();
    ['recv', 'pay'].forEach(function(side) {
      m[side].groups.forEach(function(g) {
        g.txns.forEach(function(t) {
          if ((t.yearUsed || 0) > TOL) relatedTxnKeys.add(side + ':' + g.key + ':' + t.key);
        });
      });
    });
    if (m.dateRangeView) {
      bankCountHTML = '跨期核销取数 <b>' + m.banks.length + '</b> 笔（含区间外） ｜ 本次发票核销涉及 <b>' + relatedTxnKeys.size + '</b> 笔';
    } else {
      bankCountHTML = '跨年核销取数 <b>' + m.banks.length + '</b> 笔（含历史） ｜ 本次发票核销涉及 <b>' + relatedTxnKeys.size + '</b> 笔';
    }
  }

  var html = '';
  html += '<div class="report-head">' +
    (f.company ? '<div class="report-back no-print"><button class="link-btn" onclick="backToAllCompanies()">← 返回全部单位</button></div>' : '') +
    '<h1>' + title + '</h1>' +
    '<div class="report-meta">' +
      '核对主体：<b>' + escapeHTML(m.our || '未识别') + '</b> ｜ 数据期间：<b>' + escapeHTML(m.dates) + '</b> ｜ 编制日期：<b>' + m.generatedAt.slice(0, 10) + '</b><br>' +
      '筛选范围：<b>' + escapeHTML(filterSummary(f)) + '</b> ｜ 本次发票 <b>' + m.invoices.length + '</b> 张（参与核对 <b>' + effTotal + '</b> 张 ｜ 红冲 <b>' + redTotal + '</b> 张' +
        (personalTotal ? ' ｜ 个人支付 <b>' + personalTotal + '</b> 张（视为结清）' : '') + '） ｜ ' + bankCountHTML +
      (m.yearView && !m.dateRangeView ? '<br>跨年核销口径：<b>仅列示所选年份发票；完整历史发票及截至 ' + escapeHTML(m.yearEnd) + ' 的流水已参与核销，不使用以后年度流水</b>' : '') +
      (m.accounts && m.accounts.length ? '<br>本方账号：<b class="acct">' + m.accounts.map(escapeHTML).join('、') + '</b>' : '') +
    '</div>' +
  '</div>';

  var hasUnmatched = unmatchedGroups(m).length > 0;
  if (!m.invoices.length && !hasUnmatched) {
    html += '<div class="empty-report">当前筛选条件下没有对应的发票数据，请调整年份、方向、核对状态或往来单位。</div>';
    html += notesHTML();
    document.getElementById('report').innerHTML = html;
    applyPrintSelections();
    return;
  }

  // KPI：只展示有数据的方向
  var cards = '';
  var cardCount = 0;
  if (m.recv.invoiceCount > 0 || m.recv.totalBank > 0) { cards += kpiCard('recv', recvLabel, m.recv); cardCount++; }
  if (m.pay.invoiceCount > 0 || m.pay.totalBank > 0) { cards += kpiCard('pay', payLabel, m.pay); cardCount++; }
  if (cardCount) html += '<div class="kpi-grid' + (cardCount <= 1 ? ' single' : '') + '" data-psec="kpi">' + cards + '</div>';

  // 经营测算需同时包含销售与采购，避免单方向筛选造成误读
  if (m.invoices.length && m.direction === 'all') html += '<div class="section" data-psec="operating">' + sectionOperating(m) + '</div>';

  // 按往来单位核对
  if (m.recv.groups.length) html += sectionGroup('recv', recvLabel + ' — 按往来单位核对', m.recv, f);
  if (m.pay.groups.length) html += sectionGroup('pay', payLabel + ' — 按往来单位核对', m.pay, f);

  // 单户报告：补充该单位的银行流水明细
  if (f.company) html += sectionCompanyBanks(m);

  // 发票明细
  if (m.recv.groups.length) html += sectionDetail('recv', recvLabel + ' — 发票明细核对', m.recv);
  if (m.pay.groups.length) html += sectionDetail('pay', payLabel + ' — 发票明细核对', m.pay);

  // 无对应发票的银行流水（单户报告不展示；按核对状态筛选时另作提示）
  if (!f.company) {
    if (m.hideUnmatched) {
      html += '<div class="muted" style="font-size:12px;margin:8px 2px;">按核对状态筛选时不列示无对应发票的资金往来；如需查看，请将方向切换为「无对应发票往来单位」。</div>';
    } else {
      html += sectionUnmatched(m);
    }
  }

  html += notesHTML();
  document.getElementById('report').innerHTML = html;
  applyPrintSelections();
}

function notesHTML() {
  return '<div class="notes' + (includeNotesInPrint ? '' : ' no-print') + '">' +
    '<b>核对说明：</b><br>' +
    '1. 发票按「数电发票号码 / 发票代码+号码」去重，同一张发票跨多行、跨工作表只计一次；红冲及负数发票不参与应收应付金额与核销，仅单独统计张数并在明细中列示；状态为「已作废」的发票直接排除，不构成应收应付。<br>' +
    '2. 我方主体自动识别为两张发票中同时出现的固定一方：销方为我方计入应收，购方为我方计入应付。<br>' +
    '3. 银行流水按「核心唯一流水号」等去重；仅将对方户名与发票往来单位一致的收支纳入核销。无对应发票的收入、支出均单独记录，按单位汇总并计算净额（收入−支出），正数为净流入、负数为净流出，不参与发票核销；每个单位可展开「查看明细」核对逐笔往来及抵消过程。对方账户导出的流水需勾选「对方流水」反转收支，往来单位取该账户名称；同一期间请勿同时导入双方流水，避免重复计算。<br>' +
    '4. 应收（销售）：开票金额与回款金额完全一致（尾差 ±0.1 元以内）的优先一一匹配，开票日与回款日相差不超过 3 个月，取日期最接近的一张发票；其余回款按交易日期先后逐笔核销（先冲旧账）：先冲开票日期不晚于该笔回款的最早未结清发票（先票后款）；当期无票可冲时，结余作为预收按日期顺序冲抵其后最早未结清发票。不再做同月配对与 3 个月内优先，确保新到账资金优先清偿历史旧账。一笔回款可核销多张发票，一张发票可分多笔回款。摘要含「定价、订金、保证金」的流水最后参与核销：普通流水优先冲抵发票，仍有未结清发票时，票额与流水金额一致的按同额匹配，否则按日期顺序核销；未分配部分计入多收，但金额仍计入可对应银行流水。客户退款冲减已回款，先冲未分配的收款，再按发票倒序冲减已核销金额；仅有销售发票、没有采购发票的单位，其银行支出视为客户退款，双向往来单位的支出仍按采购付款处理。多收但无同户名退款流水的，需核实是否为预收款或发票未全量导出。<br>' +
    '5. 应付（采购）：核对口径与应收（销售）完全一致，仅收付方向相反。开票金额与付款金额完全一致（尾差 ±0.1 元以内）的优先一一匹配，开票日与付款日相差不超过 3 个月，取日期最接近的一张发票；其余付款按交易日期先后逐笔核销（先冲旧账）：先冲开票日期不晚于该笔付款的最早未结清进项发票（先票后款）；当期无票可冲时，结余作为预付冲抵其后最早未结清发票。不再做同月配对与 3 个月内优先，确保新付出资金优先清偿历史旧账。一笔付款可核销多张发票，一张发票可分多笔付款。摘要含「定价、订金、保证金」的流水最后参与核销：普通流水优先冲抵发票，仍有未结清发票时，票额与流水金额一致的按同额匹配，否则按日期顺序核销；未分配部分计入多付，但金额仍计入可对应银行流水。供应商退款冲减已付款，先冲未分配的多付款，再按发票倒序冲减已核销金额。仅有采购发票、没有销售发票的单位，其银行收入视为供应商退款冲减；双向往来单位的收入仍按销售回款处理。多付但无同户名退款流水的，需核实是否为预付款、保证金或发票未全量导出。<br>' +
    '6. 单户报告中银行流水「本方账号」为收款/付款账户，「对方账号」为交易对手账户。<br>' +
    '7. 选择年份时，报告仅列示所选年份发票；核销仍使用完整历史发票及截至所选年份期末的全部历史流水，不使用有明确以后年度日期的流水。无交易日期的流水无法判断所属期间，为避免漏算仍参与核销。历史已结清回款不会重复冲抵所选年份发票，历史结余可继续核销；全部年份报告若包含更晚流水，其最终结清状态可能与此不同。年份筛选下的单户流水仅列与本次发票存在核销关系的流水（含跨年度），「本次发票核销」为分配到本次发票的金额，另核销其他年份的金额单独标注。退款冲减见发票明细。<br>' +
    '8. 经营测算按当前筛选范围的含税销售开票与含税采购开票计算：进销差额＝销售开票−采购开票，资金净流量＝可对应收款−可对应付款，两者均不代表净利润。多收客户按回款超开票的未分配余额列示，少付供应商按采购发票未付款余额列示；方向需选择「全部」。<br>' +
    '9. 应付（采购）方向中，商品名称为住宿、餐饮、餐费、伙食类（或缺少商品名称但销方为酒店、宾馆、旅馆、饭店等）的发票，视为个人支付：含税金额仍计入进项票金额，状态标记为「个人支付」并视为结清，不计入已付款，也不计入未付款，付款率按扣除该部分后的金额计算。<br>' +
     '</div>';
}

function kpiCard(cls, label, d) {
  var eff = d.invoiceCount - d.redCount - (d.totalPersonalCount || 0);
  var redTip = d.redCount
    ? ' ｜ 另有红冲 ' + d.redCount + ' 张' + (d.redAmount > TOL ? '（¥' + fmtMoney(d.redAmount) + '）' : '') + '（不计入核销）'
    : '';

  var isPay = cls === 'pay';
  var rate = Math.max(0, Math.min(1, d.rate || 0));
  var refundTip = d.totalRefund > TOL ? ' ｜ 已冲减退款 ¥ ' + fmtMoney(d.totalRefund) : '';
  var personalRow = d.totalPersonal > TOL
    ? '<div class="kpi-row"><span>个人支付（住宿/餐饮 ' + d.totalPersonalCount + ' 张）</span><b>¥ ' + fmtMoney(d.totalPersonal) + '</b></div>'
    : '';
  return '<div class="kpi-card ' + cls + '">' +
    '<div class="kpi-title">' + label + '</div>' +
    '<div class="kpi-main"><small>¥</small>' + fmtMoney(d.totalInvoice) + '</div>' +
    '<div class="kpi-row"><span>' + (isPay ? '已付款' : '已回款') + '</span><b class="green">¥ ' + fmtMoney(d.totalPaid) + '</b></div>' +
    personalRow +
    '<div class="kpi-row"><span>' + (isPay ? '未付款' : '未回款') + '</span><b class="red">¥ ' + fmtMoney(d.totalUnpaid) + '</b></div>' +
    '<div class="bar"><i style="width:' + (rate * 100).toFixed(1) + '%"></i></div>' +
    '<div class="kpi-foot">' + (isPay ? '付款率 ' : '回款率 ') + (rate * 100).toFixed(1) + '% ｜ 参与核对 ' +
      eff + ' 张发票' + redTip + ' ｜ 可对应银行流水 ¥ ' + fmtMoney(d.totalBank) + refundTip +
      (d.totalPersonal > TOL ? ' ｜ 率按扣除个人支付后金额计算' : '') + '</div>' +
  '</div>';
}

function sectionOperating(m) {
  var sales = m.recv.totalInvoice || 0;
  var purchases = m.pay.totalInvoice || 0;
  var margin = r2(sales - purchases);
  var cashNet = r2((m.recv.totalBank || 0) - (m.pay.totalBank || 0));
  var overReceived = m.recv.groups.filter(function(g) { return g.bankLeft > TOL; })
    .sort(function(a, b) { return b.bankLeft - a.bankLeft; });
  var underPaid = m.pay.groups.filter(function(g) { return g.unpaid > TOL; })
    .sort(function(a, b) { return b.unpaid - a.unpaid; });

  function metric(label, value, sub, signed) {
    var color = signed ? (value > TOL ? 'var(--green)' : value < -TOL ? 'var(--red)' : 'var(--text)') : 'var(--text)';
    return '<div class="um-item"><div class="um-label">' + label + '</div>' +
      '<div class="um-value" style="color:' + color + ';">¥' + fmtMoney(value) + '</div>' +
      '<div class="um-sub">' + sub + '</div></div>';
  }

  function balanceTable(title, list, kind) {
    var isOver = kind === 'over';
    var rows = list.map(function(g) {
      var diff = isOver ? g.bankLeft : g.unpaid;
      return '<tr><td class="left">' + escapeHTML(g.name) + '</td>' +
        '<td>' + fmtMoney(g.invoiceAmount) + '</td>' +
        '<td>' + fmtMoney(g.paid) + '</td>' +
        '<td><b class="' + (isOver ? 'green' : 'red') + '">' + fmtMoney(diff) + '</b></td></tr>';
    }).join('');
    var total = r2(list.reduce(function(sum, g) { return sum + (isOver ? g.bankLeft : g.unpaid); }, 0));
    if (!rows) rows = '<tr><td colspan="4" class="muted" style="padding:12px 0;">' + (isOver ? '暂无多收客户' : '暂无少付供应商') + '</td></tr>';
    else rows += '<tr style="font-weight:600;background:var(--bg-soft);"><td class="left">合计</td><td>—</td><td>—</td><td>' + fmtMoney(total) + '</td></tr>';
    return '<div class="section-title" style="font-size:13px;margin-top:14px;">' + title +
      '<span class="sub">' + list.length + ' 个单位 ｜ 合计 ¥' + fmtMoney(total) + '</span></div>' +
      '<div class="table-wrap"><table><thead><tr><th>' + (isOver ? '客户' : '供应商') + '</th>' +
      '<th>' + (isOver ? '含税销售开票' : '含税采购开票') + '</th>' +
      '<th>' + (isOver ? '已核销回款' : '已核销付款') + '</th>' +
      '<th>' + (isOver ? '多收金额（超开票）' : '少付金额（未付款）') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  return '<div class="section-title">经营测算（含税进销口径）<span class="sub">按当前筛选范围汇总</span></div>' +
    '<div class="um-summary">' +
      metric('含税销售开票', sales, m.recv.invoiceCount + ' 张销售发票', false) +
      metric('含税采购开票', purchases, m.pay.invoiceCount + ' 张采购发票', false) +
      metric('进销差额（估算）', margin, '销售开票 − 采购开票', true) +
      metric('资金净流量', cashNet, '可对应收款 − 可对应付款', true) +
    '</div>' +
    '<div class="muted" style="font-size:12px;margin:8px 2px 4px;">进销差额仅为含税发票口径的粗略测算，不是净利润；资金净流量也不代表利润。多收、少付按核销后的实际差额列示。</div>' +
    balanceTable('多收客户（回款超开票）', overReceived, 'over') +
    balanceTable('少付供应商（尚未付清）', underPaid, 'under');
}

function statusTag(status) {
  if (status === 'done') return '<span class="tag done">已结清</span>';
  if (status === 'partial') return '<span class="tag partial">部分</span>';
  if (status === 'red') return '<span class="tag red">红冲</span>';
  if (status === 'personal') return '<span class="tag personal">个人支付</span>';
  return '<span class="tag open">未结清</span>';
}

function sectionGroup(side, title, d, flt) {
  var isRecv = side === 'recv';
  var currentKey = flt && flt.company ? normName(flt.company) : '';

  var rows = d.groups.map(function(g, idx) {
    var isCurrent = currentKey && g.key === currentKey;
    var action = isCurrent
      ? ''
      : '<span class="no-print"><br><button class="link-btn" onclick="companyReport(\'' + side + '\',' + idx + ')">查看单户报告</button></span>';
    var nameCell = '<td class="left">' + escapeHTML(g.name) + action + '</td>';
    var rate = g.payable > 0 ? (g.paid / g.payable * 100) : (g.paid > TOL ? 100 : 0);
    var extra = g.bankLeft > TOL
      ? '<div class="muted" style="font-size:11px;margin-top:2px;">' + (isRecv ? '回款超开票' : '付款超开票') + ' ¥' + fmtMoney(g.bankLeft) + '</div>'
      : '';
    if (g.personalAmount > TOL) {
      extra += '<div class="muted" style="font-size:11px;margin-top:2px;">个人支付 ¥' + fmtMoney(g.personalAmount) + '（' + g.personalCount + ' 张，视为结清）</div>';
    }
    if (g.refundTotal > TOL) {
      extra += '<div class="muted" style="font-size:11px;margin-top:2px;">' + (isRecv ? '客户退款冲减' : '供应商退款冲减') + ' ¥' + fmtMoney(g.refundTotal) + '</div>';
    }
    return '<tr' + (isCurrent ? ' class="current-row"' : '') + '>' +
      nameCell +
      '<td>' + g.invoices.length + (g.personalCount ? '<div class="muted" style="font-size:11px;">个人支付 ' + g.personalCount + '</div>' : '') + '</td>' +
      '<td>' + (g.redCount
        ? g.redCount + (Math.abs(g.redAmount || 0) > TOL ? '<div class="muted" style="font-size:11px;">¥' + fmtMoney(Math.abs(g.redAmount)) + '</div>' : '')
        : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + fmtMoney(g.invoiceAmount) + '</td>' +
      '<td class="num">' + fmtMoney(g.bankAmount) + '</td>' +
      '<td class="num">' + fmtMoney(g.paid) + '</td>' +
      '<td class="num" style="color:' + (g.unpaid > TOL ? '#dc2626' : '#15803d') + ';">' + fmtMoney(g.unpaid) + '</td>' +
      '<td>' + rate.toFixed(1) + '%</td>' +
      '<td>' + statusTag(g.status) + extra + '</td>' +
    '</tr>';
  }).join('');

  if (!rows) rows = '<tr><td colspan="9" class="muted" style="padding:18px 0;">暂无数据</td></tr>';
  return '<div class="section" data-psec="' + side + 'Group">' +
    '<div class="section-title ' + (isRecv ? '' : 'pay') + '">' + title +
      '<span class="sub">共 ' + d.groups.length + ' 个单位</span></div>' +
    '<div class="table-wrap"><table class="rpt">' +
      '<thead><tr><th>往来单位</th><th>参与核对<br>发票张数</th><th>红冲<br>张数</th><th>' + (isRecv ? '开票金额' : '进项票金额') + '</th><th>对应银行流水</th><th>' + (isRecv ? '已回款' : '已付款') + '</th><th>' + (isRecv ? '未回款' : '未付款') + '</th><th>' + (isRecv ? '回款率' : '付款率') + '</th><th>状态</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td class="left">合计</td><td>' + (d.effectiveCount - (d.totalPersonalCount || 0)) + '</td><td>' + d.redCount + '</td><td class="num">' + fmtMoney(d.totalInvoice) + '</td><td class="num">' + fmtMoney(d.totalBank) + '</td><td class="num">' + fmtMoney(d.totalPaid) + '</td><td class="num">' + fmtMoney(d.totalUnpaid) + '</td><td>' + (d.rate * 100).toFixed(1) + '%</td><td></td></tr></tfoot>' +
    '</table></div>' +
  '</div>';
}

function sectionCompanyBanks(m) {
  var defs = [
    { side: 'recv', label: '收款流水（收入 / 客户退款）', d: m.recv, cls: '' },
    { side: 'pay', label: '付款流水（支出 / 供应商退款）', d: m.pay, cls: 'pay' }
  ];
  var blocks = '';
  var allocationView = !!m.yearView;

  defs.forEach(function(def) {
    if (!def.d.groups.length) return;
    var flow = [], refundCount = 0;
    def.d.groups.forEach(function(g) {
      g.txns.forEach(function(t) {
        if (allocationView && (t.yearUsed || 0) <= TOL) return;
        flow.push({ type: 'txn', t: t });
      });
      if (!allocationView) (g.refunds || []).forEach(function(r) { flow.push({ type: 'refund', t: r }); refundCount++; });
    });
    flow.sort(function(a, b) { return (a.t.date || '') < (b.t.date || '') ? 1 : -1; });

    var refundName = def.side === 'recv' ? '客户退款' : '供应商退款';
    var rows = flow.map(function(item) {
      var t = item.t;
      var cpAcct = t.cpAccount
        ? '<span class="acct">' + escapeHTML(t.cpAccount) + '</span>' + (t.cpBank ? '<div class="muted" style="font-size:10.5px;">' + escapeHTML(t.cpBank) + '</div>' : '')
        : '<span class="muted">—</span>';
      var isRefund = item.type === 'refund';
      var purpose = isRefund
        ? '<span class="tag red">' + refundName + '</span> ' + escapeHTML(t.purpose || '')
        : escapeHTML(t.purpose || '—');
      var tail;
      if (isRefund) {
        tail = '<td class="num"><span class="muted">—</span></td><td class="num"><span class="muted">—</span></td>';
      } else if (allocationView) {
        var otherMatched = r2((t.matchedTotal || 0) - (t.yearUsed || 0));
        tail = '<td class="num">' + fmtMoney(t.yearUsed || 0) +
            (otherMatched > TOL ? '<div class="muted" style="font-size:10.5px;">另核销其他年份 ¥' + fmtMoney(otherMatched) + '</div>' : '') +
            (t.refundCut > TOL ? '<div class="muted" style="font-size:10.5px;">退款冲减 ¥' + fmtMoney(t.refundCut) + '</div>' : '') +
          '</td><td class="num">' + fmtMoney(t.remaining || 0) + '</td>';
      } else {
        tail = '<td class="num">' + fmtMoney(t.used || 0) +
            (t.refundCut > TOL ? '<div class="muted" style="font-size:10.5px;">退款冲减 ¥' + fmtMoney(t.refundCut) + '</div>' : '') +
          '</td><td class="num">' + fmtMoney(t.remaining || 0) + '</td>';
      }
      return '<tr>' +
        '<td>' + escapeHTML(t.date || '—') + '</td>' +
        '<td class="acct">' + escapeHTML(t.account || '—') + '</td>' +
        '<td>' + cpAcct + '</td>' +
        '<td class="left muted">' + purpose + '</td>' +
        '<td class="num"' + (isRefund ? ' style="color:#dc2626;"' : '') + '>' + (isRefund ? '−' : '') + fmtMoney(t.amount) + '</td>' +
        tail +
      '</tr>';
    }).join('');

    var colspan = 7;
    if (!rows) rows = '<tr><td colspan="' + colspan + '" class="muted" style="padding:14px 0;">' + (allocationView ? '本次年份发票暂无核销流水' : '该方向暂无银行流水') + '</td></tr>';
    var head = '<th>交易日期</th><th>本方账号</th><th>对方账号</th><th>摘要 / 用途</th><th>交易金额</th>' +
      (allocationView ? '<th>本次发票核销</th><th>未核销余额</th>' : '<th>已核销</th><th>未核销</th>');
    var flowLabel = allocationView
      ? (def.side === 'recv' ? '收款流水（本次发票核销）' : '付款流水（本次发票核销）')
      : def.label;

    blocks += '<div style="margin-top:10px;">' +
      '<div class="section-title ' + def.cls + '" style="font-size:13px;">' + flowLabel +
        '<span class="sub">共 ' + (flow.length - refundCount) + ' 笔' + (refundCount ? ' ｜ 退款 ' + refundCount + ' 笔（已冲减）' : '') +
        (allocationView ? ' ｜ 含核销本次发票的跨年度流水；退款冲减见发票明细' : '') + '</span></div>' +
      '<div class="table-wrap"><table class="rpt">' +
        '<thead><tr>' + head + '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +
    '</div>';
  });

  if (!blocks) blocks = '<div class="empty-report" style="padding:24px 0;">该单位暂无银行流水记录</div>';

  return '<div class="section" data-psec="companyBanks">' +
    '<div class="section-title">单户银行流水明细<span class="sub">' + escapeHTML(m.filters.company) + '</span></div>' +
    blocks +
  '</div>';
}

function sectionDetail(side, title, d) {
  var all = [];
  d.groups.forEach(function(g) {
    g.invoices.forEach(function(inv) { all.push(inv); });
    g.redInvoices.forEach(function(inv) { all.push(inv); });
  });
  all.sort(function(a, b) { return (a.date || '') < (b.date || '') ? 1 : -1; });

  var rows = all.map(function(inv) {
    var matches = '';
    if (inv.matchStatus === 'red') {
      matches = '<span class="muted">红冲 / 负数发票，不参与核销</span>';
    } else if (inv.personal) {
      matches = '<span class="muted">住宿/餐饮类，个人支付，视为结清（不计公司付款、不计未付款）</span>' +
        (inv.goods ? '<div class="muted" style="font-size:11px;">' + escapeHTML(inv.goods) + '</div>' : '');
    } else if (inv.matches.length) {
      matches = '<div class="match-list">' + inv.matches.slice(0, 4).map(function(x) {
        // 流水早于开票且超过 3 个月，属于预收/预付余额冲抵，标注为余额冲抵并附原始预付日期
        if (x.date && inv.date && x.date < inv.date && !withinMonths(x.date, inv.date, 3)) {
          return (side === 'recv' ? '预收余额冲抵 ' : '预付余额冲抵 ') + '¥' + fmtMoney(x.amount) +
            '<span class="muted" style="font-size:10.5px;">（' + escapeHTML(x.date) + (side === 'recv' ? ' 预收' : ' 预付') + '）</span>';
        }
        return (side === 'recv' ? '收款 ' : '付款 ') + escapeHTML(x.date || '—') + ' ¥' + fmtMoney(x.amount);
      }).join('<br>') + (inv.matches.length > 4 ? '<br>… 共 ' + inv.matches.length + ' 笔' : '') + '</div>';
    } else {
      matches = '<span class="muted">—</span>';
    }
    if (inv.refundCut > 0) {
      matches += '<div class="match-list" style="color:#dc2626;">' + (side === 'recv' ? '客户退款冲减' : '供应商退款冲减') + ' ¥' + fmtMoney(inv.refundCut) + '</div>';
    }
    return '<tr data-status="' + inv.matchStatus + '">' +
      '<td>' + escapeHTML(inv.date || '—') + '</td>' +
      '<td>' + escapeHTML(inv.no) + '</td>' +
      '<td class="left">' + escapeHTML(side === 'recv' ? inv.buyer : inv.seller) + '</td>' +
      '<td class="num">' + fmtMoney(inv.amount) + '</td>' +
      '<td class="num">' + fmtMoney(inv.paid || 0) + '</td>' +
      '<td class="num">' + fmtMoney(inv.matchStatus === 'red' ? 0 : (inv.remain || 0)) + '</td>' +
      '<td>' + statusTag(inv.matchStatus) + '</td>' +
      '<td>' + matches + '</td>' +
    '</tr>';
  }).join('');

  if (!rows) rows = '<tr><td colspan="8" class="muted" style="padding:18px 0;">暂无数据</td></tr>';
  var selectId = 'filter_' + side;

  var redCount = all.filter(function(inv) { return inv.matchStatus === 'red'; }).length;
  var personalCount = all.filter(function(inv) { return inv.personal; }).length;
  return '<div class="section" data-psec="' + side + 'Detail">' +
    '<div class="section-title ' + (side === 'recv' ? '' : 'pay') + '">' + title +
      '<span class="sub">参与核对 ' + (all.length - redCount - personalCount) + ' 张' +
        (personalCount ? ' ｜ 个人支付 ' + personalCount + ' 张（视为结清）' : '') +
        (redCount ? ' ｜ 红冲 ' + redCount + ' 张（不计入）' : '') + '</span></div>' +
    '<div class="detail-tools">' +
      '<label>显示：</label>' +
      '<select id="' + selectId + '" onchange="filterDetail(\'' + side + '\', this.value)">' +
        '<option value="all">全部</option>' +
        '<option value="open">未结清</option>' +
        '<option value="partial">部分核销</option>' +
        '<option value="done">已结清</option>' +
        (side === 'pay' ? '<option value="personal">个人支付</option>' : '') +
        '<option value="red">红冲</option>' +
      '</select>' +
    '</div>' +
    '<div class="table-wrap"><table class="rpt" id="detail_' + side + '">' +
      '<thead><tr><th>开票日期</th><th>发票号码</th><th>往来单位</th><th>含税金额</th><th>已核销</th><th>未核销</th><th>状态</th><th>核销记录</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table></div>' +
  '</div>';
}

function filterDetail(side, value) {
  var table = document.getElementById('detail_' + side);
  if (!table) return;
  var rows = table.querySelectorAll('tbody tr');
  for (var i = 0; i < rows.length; i++) {
    var st = rows[i].getAttribute('data-status');
    rows[i].style.display = (value === 'all' || st === value) ? '' : 'none';
  }
}

// 无票流水按单位合并：收入、支出、净额（收入−支出）及逐笔明细
function unmatchedGroups(m) {
  var map = new Map();
  function merge(list, dir) {
    list.forEach(function(o) {
      var k = normName(o.name);
      if (!map.has(k)) {
        map.set(k, { name: o.name, cpAccounts: [], txns: [], inCount: 0, inAmount: 0, outCount: 0, outAmount: 0, purpose: '' });
      }
      var r = map.get(k);
      if (dir === 'in') { r.inCount += o.count; r.inAmount = r2(r.inAmount + o.amount); }
      else { r.outCount += o.count; r.outAmount = r2(r.outAmount + o.amount); }
      (o.txns || []).forEach(function(t) {
        r.txns.push({ dir: dir, date: t.date, amount: t.amount, purpose: t.purpose, account: t.account, cpAccount: t.cpAccount, cpBank: t.cpBank });
      });
      if (!r.purpose && o.purpose) r.purpose = o.purpose;
      (o.cpAccounts || []).forEach(function(a) { if (r.cpAccounts.indexOf(a) === -1) r.cpAccounts.push(a); });
    });
  }
  merge(m.recv.unmatchedBank, 'in');
  merge(m.pay.unmatchedBank, 'out');

  return Array.from(map.values()).sort(function(a, b) {
    return Math.abs(r2(b.inAmount - b.outAmount)) - Math.abs(r2(a.inAmount - a.outAmount));
  });
}

// 无票流水表格：expandAll=明细全部展开；single=单户视图（不再显示单户报告按钮）
function unmatchedTableHTML(list, expandAll, single) {
  function amountCell(amount, count) {
    if (!count) return '<td class="num"><span class="muted">—</span></td>';
    return '<td class="num">' + fmtMoney(amount) + '<div class="muted" style="font-size:11px;">' + count + ' 笔</div></td>';
  }

  var rows = list.map(function(r, idx) {
    var net = r2(r.inAmount - r.outAmount);
    var accts = r.cpAccounts.length
      ? r.cpAccounts.map(escapeHTML).join('<br>')
      : '<span class="muted">—</span>';
    var actions = '<span class="no-print"><br><button class="link-btn" onclick="toggleUnmatchedDetail(' + idx + ', this)">' + (expandAll ? '收起明细' : '查看明细') + '</button>' +
      (single ? '' : ' <button class="link-btn" onclick="unmatchedCompanyReport(' + idx + ')">单户报告</button>') + '</span>';
    var summary = '<tr>' +
      '<td class="left">' + escapeHTML(r.name) + actions + '</td>' +
      '<td class="acct" style="white-space:normal;">' + accts + '</td>' +
      amountCell(r.inAmount, r.inCount) +
      amountCell(r.outAmount, r.outCount) +
      '<td class="num" style="color:' + (net > TOL ? '#15803d' : (net < -TOL ? '#dc2626' : '#6b7280')) + ';">' + fmtMoney(net) + '</td>' +
      '<td class="left muted">' + escapeHTML(r.purpose || '—') + '</td>' +
    '</tr>';

    // 逐笔明细：按日期升序，支出以负数列示，末尾给出收入−支出=净额的抵消过程
    var detailRows = r.txns.slice().sort(byDateAsc).map(function(t) {
      var isIn = t.dir === 'in';
      return '<tr>' +
        '<td>' + escapeHTML(t.date || '—') + '</td>' +
        '<td>' + (isIn ? '收入' : '支出') + '</td>' +
        '<td class="num" style="color:' + (isIn ? '#15803d' : '#dc2626') + ';">' + (isIn ? '' : '−') + fmtMoney(t.amount) + '</td>' +
        '<td class="acct">' + escapeHTML(t.account || '—') + '</td>' +
        '<td class="acct">' + escapeHTML(t.cpAccount || '—') + (t.cpBank ? '<div class="muted" style="font-size:10.5px;">' + escapeHTML(t.cpBank) + '</div>' : '') + '</td>' +
        '<td class="left muted">' + escapeHTML(t.purpose || '—') + '</td>' +
      '</tr>';
    }).join('');
    var detail = '<tr id="umd_' + idx + '" style="display:' + (expandAll ? '' : 'none') + ';"><td colspan="6" style="background:#fafafa;">' +
      '<div style="padding:6px 4px;">' +
        '<table class="rpt" style="font-size:12px;">' +
          '<thead><tr><th>交易日期</th><th>方向</th><th>金额</th><th>本方账号</th><th>对方账号</th><th>摘要 / 用途</th></tr></thead>' +
          '<tbody>' + detailRows + '</tbody>' +
        '</table>' +
        '<div class="muted" style="font-size:12px;margin-top:4px;">收入 ¥' + fmtMoney(r.inAmount) + '（' + r.inCount + ' 笔） − 支出 ¥' + fmtMoney(r.outAmount) + '（' + r.outCount + ' 笔） ＝ 净额 ¥' + fmtMoney(net) + '</div>' +
      '</div></td></tr>';
    return summary + detail;
  });

  var totalIn = r2(list.reduce(function(s, r) { return s + r.inAmount; }, 0));
  var totalOut = r2(list.reduce(function(s, r) { return s + r.outAmount; }, 0));
  var totalInCount = list.reduce(function(s, r) { return s + r.inCount; }, 0);
  var totalOutCount = list.reduce(function(s, r) { return s + r.outCount; }, 0);
  var totalNet = r2(totalIn - totalOut);
  var body = rows.length ? rows.join('') : '<tr><td colspan="6" class="muted" style="padding:18px 0;">全部银行流水均已找到对应发票往来单位</td></tr>';
  var foot = rows.length
    ? '<tfoot><tr><td class="left">合计</td><td></td><td class="num">' + fmtMoney(totalIn) + '</td><td class="num">' + fmtMoney(totalOut) + '</td>' +
      '<td class="num" style="color:' + (totalNet > TOL ? '#15803d' : (totalNet < -TOL ? '#dc2626' : '#6b7280')) + ';">' + fmtMoney(totalNet) + '</td><td></td></tr></tfoot>'
    : '';

  return {
    html: '<div class="table-wrap"><table class="rpt">' +
      '<thead><tr><th>对方户名</th><th>对方账号</th><th>无票收入</th><th>无票支出</th><th>净额<br>（收入−支出）</th><th>摘要 / 用途示例</th></tr></thead>' +
      '<tbody>' + body + '</tbody>' + foot +
    '</table></div>',
    totalIn: totalIn,
    totalOut: totalOut,
    totalNet: totalNet,
    totalInCount: totalInCount,
    totalOutCount: totalOutCount,
    empty: !rows.length
  };
}

// 无票资金往来汇总条：突出收入、支出、净额及笔数
function unmatchedSummaryHTML(t, note) {
  var netCls = t.totalNet > TOL ? 'net-pos' : (t.totalNet < -TOL ? 'net-neg' : '');

// 各区域的打印开关：仅影响打印，屏幕浏览始终显示
var printSections = {
  kpi: true,
  operating: true,
  recvGroup: true,
  payGroup: true,
  companyBanks: true,
  recvDetail: true,
  payDetail: true
};

function toggleSectionPrint(key, checked) {

function applyPrintSelections() {
  var list = document.querySelectorAll('#report [data-psec]');
  for (var i = 0; i < list.length; i++) {
    var key = list[i].getAttribute('data-psec');
    list[i].classList.toggle('no-print', printSections[key] === false);
  }
  setupSectionCollapse();
  markScrollableTables();
}

// 报告各板块折叠：标题行点击收起/展开，KPI 汇总补一个标题行
function setupSectionCollapse() {
  var report = document.getElementById('report');
  if (!report || report.querySelector('.fold-title')) return;
  var kpi = report.querySelector('.kpi-grid[data-psec="kpi"]');
  if (kpi) {
    var kh = document.createElement('div');
    kh.className = 'section-title fold-title';
    kh.setAttribute('data-psec', 'kpi');
    kh.innerHTML = '汇总卡片<span class="sub">应收 / 应付</span>';
    kpi.parentNode.insertBefore(kh, kpi);
    bindFold(kh, kpi);
  }
  var secs = report.querySelectorAll(':scope > .section');
  for (var i = 0; i < secs.length; i++) {
    var t = secs[i].querySelector('.section-title');
    if (!t || t.classList.contains('fold-head')) continue;
    t.classList.add('fold-head');
    bindFold(t, secs[i]);
  }
}

function bindFold(trigger, target) {
  trigger.setAttribute('role', 'button');
  trigger.setAttribute('tabindex', '0');
  trigger.setAttribute('aria-expanded', 'true');
  trigger.addEventListener('click', function() { toggleFold(trigger, target); });
  trigger.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleFold(trigger, target);
    }
  });
}

function toggleFold(trigger, target) {
  var folded = target.classList.toggle('is-folded');
  trigger.classList.toggle('is-folded', folded);
  trigger.setAttribute('aria-expanded', folded ? 'false' : 'true');
  if (!folded) markScrollableTables();
}

// 窄屏表格超出可视宽度时，补一行“可左右滑动”提示
function markScrollableTables() {
  var wraps = document.querySelectorAll('#report .table-wrap');
  for (var i = 0; i < wraps.length; i++) {
    var w = wraps[i];
    var next = w.nextElementSibling;
    if (next && next.classList && next.classList.contains('scroll-hint')) {
      next.parentNode.removeChild(next);
    }
    if (!w.offsetParent) continue;
    if (w.scrollWidth > w.clientWidth + 2) {
      var h = document.createElement('div');
      h.className = 'scroll-hint no-print';
      h.textContent = '左右滑动查看完整表格';
      w.parentNode.insertBefore(h, w.nextSibling);
    }
  }
}

var scrollHintTimer = null;
window.addEventListener('resize', function() {
  if (scrollHintTimer) clearTimeout(scrollHintTimer);
  scrollHintTimer = setTimeout(markScrollableTables, 150);
});

function printReport() {

  applyPrintSelections();
  var name;
  if (reportView === 'unmatched') name = '无对应发票资金往来报告';
  else if (reportView === 'unmatchedCompany') name = unmatchedCompanyName + '无对应发票资金往来报告';
  else name = model.filters && model.filters.company
    ? model.filters.company + '收付款核对报告'
    : '收付款情况核对报告';
  printWithTitle(name);
}
</script>
</body>
